<!DOCTYPE html>

    <!-- Apple Liquid Glass CSS Engine -->
    <style>
    .apple-liquid-glass {
        position: relative;
        /* Refractive map for Chrome/Firefox */
        backdrop-filter: url(#liquid-glass-lens) blur(24px) saturate(150%);
        /* Fallback for Safari/Webkit which struggles with url() filters */
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%);
        border: 1px solid rgba(255,255,255,0.4);
        border-top: 1px solid rgba(255, 255, 255, 0.8);
        border-left: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,0,255,0.05), 0 24px 40px rgba(0,0,0,0.08);
    }
    html.dark .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.5) 0%, rgba(20, 20, 30, 0.2) 100%);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-left: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,200,255,0.05), 0 24px 40px rgba(0,0,0,0.4);
    }
    /* Enhanced Noise Overlay mimicking macOS vibrancy & Lens Glare */
    .apple-liquid-glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.12;
        mix-blend-mode: overlay;
        pointer-events: none;
        z-index: -1;
    }
    .apple-liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
        pointer-events: none;
        z-index: 10;
        opacity: 0.8;
    }
    html.dark .apple-liquid-glass::after {
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
    }
    </style>
</head>
<body>

<!-- Apple Liquid Glass Refraction SVG Filter -->
<svg class="pointer-events-none fixed z-[-1] opacity-0" style="display: none;" width="0" height="0">
    <defs>
        <filter id="liquid-glass-lens" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        </filter>
    </defs>
</svg>

    <!-- Animated Mesh Gradient Mesh (Enterprise) -->
    <div class="fixed top-[-20%] left-[-10%] w-[70vw] h-[70vh] rounded-full bg-primary-200/50 dark:bg-primary-900/40 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob"></div>
    <div class="fixed top-[20%] right-[-10%] w-[40vw] h-[50vh] rounded-full bg-accent-200/30 dark:bg-accent-900/40 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob-reverse" style="animation-delay: 2s;"></div>
    <div class="fixed bottom-[-20%] left-[20%] w-[50vw] h-[50vh] rounded-full bg-primary-300/30 dark:bg-primary-800/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob" style="animation-delay: 4s;"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[60%] rounded-full bg-gradient-to-tl from-rose-300/30 via-yellow-200/20 to-transparent dark:from-amber-900/40 dark:via-orange-900/20 blur-[120px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent-300/40 dark:bg-accent-800/20 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>

    <p>Redirecionando para o login...</p>
</body>
</html>
