<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificacoes | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#f4f6f8',
                        100: '#e4ebf0',
                        200: '#c5d5df',
                        300: '#9cb5c5',
                        400: '#6c90a6',
                        500: '#4f768e',
                        600: '#3e5e74',
                        700: '#334b5e',
                        800: '#2d404f',
                        900: '#212E3C',
                        950: '#1a242d',
                    },
                    accent: {
                        50: '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.2), inset 1px 0 0 0 rgba(255, 0, 0, 0.05), inset -1px 0 0 0 rgba(0, 0, 255, 0.05), 0 20px 40px 0 rgba(0, 0, 0, 0.1)',
                    'dark-glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05), inset 1px 0 0 0 rgba(255, 0, 0, 0.1), inset -1px 0 0 0 rgba(0, 200, 255, 0.1), 0 20px 40px 0 rgba(0, 0, 0, 0.5)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen">
    <!-- Mesh Gradient Mesh (Enterprise) -->
    <div class="fixed top-[-20%] left-[-10%] w-[70vw] h-[70vh] rounded-full bg-primary-200/40 dark:bg-primary-900/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed top-[20%] right-[-10%] w-[40vw] h-[50vh] rounded-full bg-accent-200/50 dark:bg-accent-900/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[60%] rounded-full bg-gradient-to-tl from-rose-300/30 via-yellow-200/20 to-transparent dark:from-amber-900/40 dark:via-orange-900/20 blur-[120px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent-300/40 dark:bg-accent-800/20 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>

    <div class="w-full max-w-4xl min-h-screen mx-auto bg-white/40 dark:bg-slate-900/50 backdrop-blur-[40px] backdrop-saturate-[180%] border border-white/40 border-t-white/80 border-l-white/80 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass bg-gradient-to-tr from-transparent via-white/10 to-white/5 dark:from-transparent dark:via-white/5 dark:to-transparent md:my-8 md:rounded-2xl md:shadow-2xl border-t border-l border-white/60 dark:border-slate-700/80 overflow-hidden">
        <header class="p-4 border-b border-white/60 dark:border-slate-700/80 flex justify-between items-center bg-slate-50 dark:bg-slate-900 backdrop-blur-xl/50 sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="MockDB.routeUser(user)" class="p-2 hover:bg-gray-200 dark:hover:bg-slate-700 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <div>
                    <h1 class="font-bold text-lg">Notificacoes</h1>
                    <p class="text-xs text-slate-500">Avisos vinculados as O.S.</p>
                </div>
            </div>
            <button onclick="markAllAsRead()" class="px-3 py-2 rounded-lg bg-primary-600 hover:bg-primary-700 text-white text-xs font-semibold">Marcar tudo como lido</button>
        </header>

        <main class="p-4 md:p-8" id="notificationList"></main>
    </div>

    <script>
        const user = MockDB.requireLogin();
        function formatTimeAgo(timestamp) {
            const diffMin = Math.floor((Date.now() - timestamp) / 60000);
            if (diffMin < 60) return `${diffMin} min atras`;
            return `${Math.floor(diffMin / 60)}h atras`;
        }

        function markAllAsRead() {
            MockDB.markMessagesAsRead(user.id);
            renderNotifications();
        }

        function renderNotifications() {
            const db = MockDB.get();
            const list = document.getElementById('notificationList');
            const notifications = MockDB.getNotificationsForUser(user.id);

            if (!notifications.length) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-52 text-slate-400">
                        <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50"></i>
                        <p>Nenhuma notificacao recebida.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.innerHTML = notifications.map(note => {
                const sender = db.users.find(entry => entry.id === note.from);
                return `
                    <a href="${note.ticketId ? `mobile_os_detail.html?ticketId=${note.ticketId}` : '#'}" class="block p-4 rounded-2xl border ${note.read ? 'bg-slate-50 border-slate-200/60 dark:bg-slate-800/50 dark:border-slate-700 opacity-80' : 'bg-white border-primary-200 dark:bg-slate-800 dark:border-primary-700/50 shadow-[0_2px_20px_rgb(0,0,0,0.04)]'} mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-full bg-primary-100 text-primary-700 dark:bg-primary-900/50 dark:text-primary-400 font-bold text-[10px] flex items-center justify-center">${sender?.name.substring(0,2).toUpperCase() || 'SY'}</div>
                                <div>
                                    <p class="text-xs font-bold text-slate-700 dark:text-slate-300">${sender?.name || 'Sistema'}</p>
                                    <p class="text-[10px] text-slate-500">${note.ticketId ? `OS #${note.ticketId}` : 'Aviso geral'}</p>
                                </div>
                                ${!note.read ? '<span class="w-2 h-2 bg-primary-500 rounded-full"></span>' : ''}
                            </div>
                            <span class="text-[10px] text-slate-500">${formatTimeAgo(note.time)}</span>
                        </div>
                        <p class="text-sm text-slate-600 dark:text-slate-400 ml-9">${note.content}</p>
                    </a>
                `;
            }).join('');

            lucide.createIcons();
        }

        renderNotifications();
    </script>
</body>
</html>
