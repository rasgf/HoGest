<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificacoes | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 900: '#0f172a', 800: '#1e293b' }, teal: { 600: '#0d9488' } } } } };
        const user = MockDB.requireLogin(['admin_geral', 'admin_manutencao', 'controlador', 'trabalhador']);
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen">
    <div class="w-full max-w-4xl min-h-screen mx-auto bg-white dark:bg-slate-800 md:my-8 md:rounded-2xl md:shadow-2xl border border-gray-200 dark:border-slate-700 overflow-hidden">
        <header class="p-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-900/50 sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="MockDB.routeUser(user)" class="p-2 hover:bg-gray-200 dark:hover:bg-slate-700 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <div>
                    <h1 class="font-bold text-lg">Notificacoes</h1>
                    <p class="text-xs text-slate-500">Avisos vinculados as O.S.</p>
                </div>
            </div>
            <button onclick="markAllAsRead()" class="px-3 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold">Marcar tudo como lido</button>
        </header>

        <main class="p-4 md:p-8" id="notificationList"></main>
    </div>

    <script>
        function formatTimeAgo(timestamp) {
            const diffMin = Math.floor((Date.now() - timestamp) / 60000);
            if (diffMin < 60) return `${diffMin} min atras`;
            return `${Math.floor(diffMin / 60)}h atras`;
        }

        function markAllAsRead() {
            MockDB.markMessagesAsRead(user.id);
            renderNotifications();
        }

        function renderNotifications() {
            const db = MockDB.get();
            const list = document.getElementById('notificationList');
            const notifications = MockDB.getNotificationsForUser(user.id);

            if (!notifications.length) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-52 text-slate-400">
                        <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50"></i>
                        <p>Nenhuma notificacao recebida.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            list.innerHTML = notifications.map(note => {
                const sender = db.users.find(entry => entry.id === note.from);
                return `
                    <a href="${note.ticketId ? `mobile_os_detail.html?ticketId=${note.ticketId}` : '#'}" class="block p-4 rounded-xl border ${note.read ? 'bg-gray-50 border-gray-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-80' : 'bg-white border-teal-200 dark:bg-slate-800 dark:border-teal-700/50 shadow-sm'} mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-full bg-teal-100 text-teal-700 dark:bg-teal-900/50 dark:text-teal-400 font-bold text-[10px] flex items-center justify-center">${sender?.name.substring(0,2).toUpperCase() || 'SY'}</div>
                                <div>
                                    <p class="text-xs font-bold text-slate-700 dark:text-slate-300">${sender?.name || 'Sistema'}</p>
                                    <p class="text-[10px] text-slate-500">${note.ticketId ? `OS #${note.ticketId}` : 'Aviso geral'}</p>
                                </div>
                                ${!note.read ? '<span class="w-2 h-2 bg-teal-500 rounded-full"></span>' : ''}
                            </div>
                            <span class="text-[10px] text-slate-500">${formatTimeAgo(note.time)}</span>
                        </div>
                        <p class="text-sm text-slate-600 dark:text-slate-400 ml-9">${note.content}</p>
                    </a>
                `;
            }).join('');

            lucide.createIcons();
        }

        renderNotifications();
    </script>
</body>
</html>
