<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens | Insolito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 900: '#0f172a', 800: '#1e293b' }, teal: { 600: '#0d9488' } } } } }
    </script>
    <script>
        const user = MockDB.requireLogin();

        function toggleTheme() {
            const doc = document.documentElement;
            if (doc.classList.contains('dark')) { doc.classList.remove('dark'); localStorage.theme = 'light'; } 
            else { doc.classList.add('dark'); localStorage.theme = 'dark'; }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
    <style>
        .app-container { width: 100%; max-width: 800px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column;}
        @media (max-width: 800px) { .app-container { max-width: 100%; border-radius: 0; box-shadow: none;border:none;} }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen">
    
    <div class="app-container bg-white dark:bg-slate-800 md:my-8 md:rounded-2xl md:shadow-2xl border border-gray-200 dark:border-slate-700 overflow-hidden relative">
        <header class="p-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-900/50 sticky top-0 z-10 w-full">
            <div class="flex items-center gap-3">
                <button onclick="goBack()" class="p-2 hover:bg-gray-200 dark:hover:bg-slate-700 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h1 class="font-bold text-lg">Caixa de Entrada</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openComposeModal()" class="px-3 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold">Nova Mensagem</button>
                <button onclick="toggleTheme()" class="p-2"><i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i><i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i></button>
            </div>
        </header>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto" id="messageList">
            <!-- Render via JS -->
        </main>
    </div>

    <div id="composeModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6">
            <h3 class="font-bold text-lg mb-2">Nova Mensagem</h3>
            <p class="text-xs text-slate-500 mb-4">Perfis de exemplo para comunicacao rapida da operacao.</p>
            <div id="recipientList" class="space-y-2 mb-4"></div>
            <textarea id="composeContent" rows="4" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 text-sm rounded-lg p-3" placeholder="Digite a mensagem..."></textarea>
            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closeComposeModal()" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-sm">Cancelar</button>
                <button onclick="sendNewMessage()" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let selectedRecipientId = null;

        function goBack() {
             MockDB.routeUser(user);
        }

        function formatTimeAgo(timestamp) {
            const diffMin = Math.floor((new Date().getTime() - timestamp) / 60000);
            if(diffMin < 60) return diffMin + ' min atrás';
            return Math.floor(diffMin / 60) + 'h atrás';
        }

        function markAllAsRead() {
             MockDB.markMessagesAsRead(user.id);
             renderMessages();
        }

        function openComposeModal() {
            const recipients = MockDB.getMessageRecipients(user.id);
            const list = document.getElementById('recipientList');
            list.innerHTML = recipients.map(recipient => `
                <button type="button" onclick="selectRecipient(${recipient.id})" id="recipient-${recipient.id}" class="w-full text-left p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-teal-400 hover:bg-teal-50 dark:hover:bg-slate-700/60 transition">
                    <div class="font-semibold text-sm">${recipient.name}</div>
                    <div class="text-[11px] text-slate-500">${recipient.role.replace('_', ' ')}</div>
                </button>
            `).join('');
            selectedRecipientId = recipients[0]?.id || null;
            if (selectedRecipientId) {
                selectRecipient(selectedRecipientId);
            }
            document.getElementById('composeModal').classList.remove('hidden');
        }

        function closeComposeModal() {
            document.getElementById('composeModal').classList.add('hidden');
        }

        function selectRecipient(recipientId) {
            selectedRecipientId = recipientId;
            const recipients = MockDB.getMessageRecipients(user.id);
            recipients.forEach(recipient => {
                const button = document.getElementById(`recipient-${recipient.id}`);
                if (!button) return;
                button.className = `w-full text-left p-3 rounded-xl border transition ${recipient.id === recipientId ? 'border-teal-500 bg-teal-50 dark:bg-slate-700/70' : 'border-slate-200 dark:border-slate-700 hover:border-teal-400 hover:bg-teal-50 dark:hover:bg-slate-700/60'}`;
            });
        }

        function sendNewMessage() {
            const content = document.getElementById('composeContent').value.trim();
            if (!selectedRecipientId || !content) {
                return;
            }
            MockDB.sendDirectMessage(user.id, selectedRecipientId, content);
            document.getElementById('composeContent').value = '';
            closeComposeModal();
            renderMessages();
        }

        function renderMessages() {
            const db = MockDB.get();
            const list = document.getElementById('messageList');
            const myMsgs = db.messages.filter(m => m.to === user.id).sort((a,b)=>b.time-a.time);

            if(myMsgs.length === 0) {
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-40 text-slate-400">
                        <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50"></i>
                        <p>Nenhuma mensagem recebida.</p>
                    </div>`;
            } else {
                let html = `<div class="flex justify-between items-center mb-4">
                              <span class="text-sm font-semibold text-slate-500">Notificações Recentes</span>
                              <button onclick="markAllAsRead()" class="text-xs text-teal-600 hover:underline">Marcar todas como lidas</button>
                            </div>
                            <div class="space-y-3">`;

                myMsgs.forEach(msg => {
                    const sender = db.users.find(u=>u.id===msg.from);
                    html += `
                        <div class="p-4 rounded-xl border ${msg.read ? 'bg-gray-50 border-gray-200 dark:bg-slate-800/50 dark:border-slate-700 opacity-70' : 'bg-white border-teal-200 dark:bg-slate-800 dark:border-teal-700/50 shadow-sm'}">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center gap-2">
                                    <div class="w-6 h-6 rounded-full bg-teal-100 text-teal-700 dark:bg-teal-900/50 dark:text-teal-400 font-bold text-[10px] flex items-center justify-center">${sender.name.substring(0,2).toUpperCase()}</div>
                                    <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${sender.name}</span>
                                    ${!msg.read ? '<span class="w-2 h-2 bg-teal-500 rounded-full"></span>' : ''}
                                </div>
                                <span class="text-[10px] text-slate-500">${formatTimeAgo(msg.time)}</span>
                            </div>
                            <p class="text-sm text-slate-600 dark:text-slate-400 ml-8">${msg.content}</p>
                        </div>
                    `;
                });
                html += `</div>`;
                list.innerHTML = html;
            }
            lucide.createIcons();
        }

        renderMessages();
    </script>
</body>
</html>
