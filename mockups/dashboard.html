<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/mock_database.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 900: '#0f172a', 800: '#1e293b' },
                        teal: { 500: '#14b8a6', 600: '#0d9488' },
                        gold: '#D4B872'
                    }
                }
            }
        };

        const user = MockDB.requireLogin(['admin_geral', 'admin_manutencao', 'controlador']);

        function toggleTheme() {
            const doc = document.documentElement;
            if (doc.classList.contains('dark')) {
                doc.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                doc.classList.add('dark');
                localStorage.theme = 'dark';
            }
            if (window.updateChartColors) window.updateChartColors();
        }

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans antialiased min-h-screen flex transition-colors duration-200">
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-slate-700">
            <img src="assets/insolito-logo.svg" alt="HotGest" class="h-9 cursor-pointer" onclick="window.location.href='dashboard.html'">
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2" id="sidebarNav"></nav>
        <div class="p-4 border-t border-gray-200 dark:border-slate-700">
            <div class="flex items-center justify-between px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer" onclick="MockDB.logout()">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                        <span class="text-xs font-bold text-slate-600 dark:text-slate-300" id="userInitials">XX</span>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-800 dark:text-slate-200" id="userNameLabel">Nome</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="userRoleLabel">Role</p>
                    </div>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 border-b border-gray-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/50 backdrop-blur flex justify-between items-center px-8">
            <h1 class="text-xl font-semibold text-slate-800 dark:text-slate-100" id="dashboardTitle">Visão Geral Operacional</h1>
            <button onclick="toggleTheme()" class="p-2 border rounded-md border-gray-200 dark:border-slate-600 hover:bg-gray-100 dark:hover:bg-slate-700 text-slate-500">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6" id="kpiGrid"></div>

            <div id="insightCard" class="bg-gradient-to-r from-teal-50 to-emerald-50 dark:from-slate-800 dark:to-slate-800/80 border border-teal-200 dark:border-slate-600 rounded-xl p-6 shadow-sm flex gap-4 items-start">
                <div class="w-10 h-10 rounded-full bg-teal-100 dark:bg-slate-700 text-teal-600 dark:text-teal-400 flex items-center justify-center shrink-0 border border-teal-200 dark:border-slate-600">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-teal-900 dark:text-teal-400 uppercase tracking-wide mb-1">Leitura do fluxo</h3>
                    <p id="insightText" class="text-sm text-slate-700 dark:text-slate-300"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-8">
                <section class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 overflow-hidden shadow-sm">
                    <div class="px-6 py-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center">
                        <h3 class="text-sm font-semibold">Fila Operacional</h3>
                        <a href="os_list.html" class="text-xs text-teal-600 hover:underline">Abrir Kanban</a>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 dark:bg-slate-900/50 text-slate-500 text-xs uppercase border-b border-gray-200 dark:border-slate-700">
                            <tr>
                                <th class="px-4 py-3">O.S.</th>
                                <th class="px-4 py-3">Responsáveis</th>
                                <th class="px-4 py-3">Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="slaTableBody" class="divide-y divide-gray-100 dark:divide-slate-700/50 text-xs text-slate-800 dark:text-slate-300"></tbody>
                    </table>
                </section>

                <section class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm flex flex-col min-h-[320px]">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-semibold">Distribuição por Status</h3>
                    </div>
                    <div class="relative flex-1 w-full">
                        <canvas id="statusChart"></canvas>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const db = MockDB.get();
        const metrics = MockDB.getDashboardMetrics();

        if (user) {
            MockDB.populateUserProfile(user);
            document.getElementById('sidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'dashboard.html');

            if (user.role === 'controlador') {
                document.getElementById('dashboardTitle').innerText = 'Visão de Controle e Estoque';
            } else if (user.role === 'admin_manutencao') {
                document.getElementById('dashboardTitle').innerText = 'Painel da Manutenção';
            }

            renderKpis();
            renderFlowTable();
            renderInsight();
        }

        function renderKpis() {
            const allTickets = db.tickets;
            const designated = allTickets.filter(ticket => ticket.status === 'designated').length;
            const inProgress = allTickets.filter(ticket => ticket.status === 'in_progress').length;
            const awaitingReview = allTickets.filter(ticket => ticket.status === 'awaiting_review').length;
            const refacoes = allTickets.filter(ticket => ticket.refacaoNumero > 0).length;

            const cards = [
                { label: 'Média SLA críticas', value: metrics.sla_media_critica, tone: 'teal' },
                { label: 'O.S. designadas', value: designated, tone: 'default' },
                { label: 'Aguardando revisão', value: awaitingReview, tone: 'gold' },
                { label: 'Refações registradas', value: refacoes, tone: 'rose' }
            ];

            if (user.role === 'controlador') {
                cards[1] = { label: 'Pendências de baixa', value: MockDB.getPendingInventoryTickets().length, tone: 'amber' };
            } else if (user.role === 'admin_manutencao') {
                cards[1] = { label: 'Em execução', value: inProgress, tone: 'default' };
            }

            document.getElementById('kpiGrid').innerHTML = cards.map(card => `
                <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border ${getCardBorder(card.tone)} shadow-sm">
                    <div class="text-slate-500 text-[11px] uppercase tracking-wider font-semibold mb-2">${card.label}</div>
                    <div class="text-3xl font-bold ${getCardText(card.tone)}">${card.value}</div>
                </div>
            `).join('');
        }

        function getCardBorder(tone) {
            if (tone === 'teal') return 'border-teal-200 dark:border-teal-500/20';
            if (tone === 'gold') return 'border-yellow-200 dark:border-yellow-500/20';
            if (tone === 'rose') return 'border-rose-200 dark:border-rose-500/20';
            if (tone === 'amber') return 'border-amber-200 dark:border-amber-500/20';
            return 'border-gray-200 dark:border-slate-700';
        }

        function getCardText(tone) {
            if (tone === 'teal') return 'text-teal-600 dark:text-teal-400';
            if (tone === 'gold') return 'text-yellow-600 dark:text-gold';
            if (tone === 'rose') return 'text-rose-600 dark:text-rose-400';
            if (tone === 'amber') return 'text-amber-600 dark:text-amber-400';
            return 'text-slate-900 dark:text-white';
        }

        function getResponsibleLabel(ticket) {
            const assigned = ticket.assignedTo ? db.users.find(entry => entry.id === ticket.assignedTo) : null;
            const reviewer = ticket.reviewerId ? db.users.find(entry => entry.id === ticket.reviewerId) : null;
            const parts = [];
            if (assigned) parts.push(`Exec.: ${assigned.name}`);
            if (reviewer) parts.push(`Rev.: ${reviewer.name}`);
            return parts.length ? parts.join(' · ') : 'Aguardando designação';
        }

        function getStatusInfo(ticket) {
            if (ticket.status === 'new') {
                return { label: 'Nova', badgeClass: 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200', border: 'border-l-4 border-slate-400', timeClass: 'text-slate-600 dark:text-slate-300' };
            }
            if (ticket.status === 'designated') {
                return { label: 'Designada', badgeClass: 'bg-sky-100 dark:bg-sky-500/20 text-sky-700 dark:text-sky-300', border: 'border-l-4 border-sky-500', timeClass: 'text-sky-600 dark:text-sky-300' };
            }
            if (ticket.status === 'in_progress') {
                return { label: 'Execução', badgeClass: 'bg-teal-100 dark:bg-teal-500/20 text-teal-700 dark:text-teal-300', border: 'border-l-4 border-teal-500', timeClass: 'text-teal-600 dark:text-teal-300' };
            }
            return { label: 'Revisão', badgeClass: 'bg-yellow-100 dark:bg-yellow-500/20 text-yellow-700 dark:text-yellow-300', border: 'border-l-4 border-yellow-500', timeClass: 'text-yellow-700 dark:text-yellow-300' };
        }

        function getTimeLabel(ticket, durations) {
            if (ticket.status === 'new') return 'Aguardando triagem';
            if (ticket.status === 'designated') return durations.timeToStartMs ? formatDuration(durations.timeToStartMs) : 'Aguardando início';
            if (ticket.status === 'in_progress') return durations.executionMs ? formatDuration(durations.executionMs) : 'Em execução';
            if (ticket.status === 'awaiting_review') return durations.reviewMs ? formatDuration(durations.reviewMs) : 'Aguardando revisão';
            return '-';
        }

        function formatDuration(ms) {
            const totalMinutes = Math.max(0, Math.floor((ms || 0) / 60000));
            if (totalMinutes < 60) return `${totalMinutes} min`;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return minutes ? `${hours}h ${minutes}min` : `${hours}h`;
        }

        function renderFlowTable() {
            const tbody = document.getElementById('slaTableBody');
            const trackedTickets = db.tickets.filter(ticket => ticket.status !== 'completed').slice().sort((a, b) => b.id - a.id);

            tbody.innerHTML = trackedTickets.map(ticket => {
                const durations = MockDB.getTicketDurations(ticket.id);
                const statusInfo = getStatusInfo(ticket);
                const refacao = ticket.refacaoNumero ? `<span class="text-[10px] bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-300 px-1.5 py-0.5 rounded font-bold uppercase">Refação #${ticket.refacaoNumero}</span>` : '';
                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/30 transition ${statusInfo.border}">
                        <td class="px-4 py-3">
                            <div class="font-medium flex items-center gap-2 flex-wrap">
                                <span class="text-[10px] ${statusInfo.badgeClass} px-1.5 py-0.5 rounded font-bold uppercase">${statusInfo.label}</span>
                                <span>#${ticket.id}</span>
                                ${refacao}
                            </div>
                            <div class="text-[10px] text-slate-400 mt-1">${ticket.location} · ${ticket.title}</div>
                        </td>
                        <td class="px-4 py-3">${getResponsibleLabel(ticket)}</td>
                        <td class="px-4 py-3 font-mono text-xs font-bold ${statusInfo.timeClass}">${getTimeLabel(ticket, durations)}</td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-500">Nenhuma O.S. ativa neste momento.</td></tr>';
        }

        function renderInsight() {
            const designated = db.tickets.filter(ticket => ticket.status === 'designated').length;
            const awaitingReview = db.tickets.filter(ticket => ticket.status === 'awaiting_review').length;
            const refacoes = db.tickets.filter(ticket => ticket.refacaoNumero > 0).length;

            let message = `Há ${designated} O.S. aguardando início formal após designação e ${awaitingReview} aguardando validação do revisor.`;
            if (refacoes) {
                message += ` O fluxo já registra ${refacoes} ocorrência(s) de refação na mesma O.S., preservando histórico e rastreabilidade.`;
            } else {
                message += ' Até o momento, nenhuma refação foi marcada na base mockada.';
            }
            document.getElementById('insightText').textContent = message;
        }

        lucide.createIcons();

        const statusCounts = {
            new: db.tickets.filter(ticket => ticket.status === 'new').length,
            designated: db.tickets.filter(ticket => ticket.status === 'designated').length,
            in_progress: db.tickets.filter(ticket => ticket.status === 'in_progress').length,
            awaiting_review: db.tickets.filter(ticket => ticket.status === 'awaiting_review').length,
            completed: db.tickets.filter(ticket => ticket.status === 'completed').length
        };

        let statusChart;
        function updateChartColors() {
            const isDark = document.documentElement.classList.contains('dark');
            const tickColor = isDark ? '#94a3b8' : '#334155';
            const gridColor = isDark ? '#334155' : '#e2e8f0';
            if (statusChart) {
                statusChart.options.scales.x.ticks.color = tickColor;
                statusChart.options.scales.y.ticks.color = tickColor;
                statusChart.options.scales.y.grid.color = gridColor;
                statusChart.update();
            }
        }

        statusChart = new Chart(document.getElementById('statusChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['Novas', 'Designadas', 'Em execução', 'Aguardando revisão', 'Concluídas'],
                datasets: [{
                    label: 'Quantidade de O.S.',
                    data: [
                        statusCounts.new,
                        statusCounts.designated,
                        statusCounts.in_progress,
                        statusCounts.awaiting_review,
                        statusCounts.completed
                    ],
                    backgroundColor: ['#94a3b8', '#38bdf8', '#14b8a6', '#facc15', '#22c55e'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { precision: 0 }
                    }
                }
            }
        });

        updateChartColors();
    </script>
</body>
</html>
