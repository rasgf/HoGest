<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>Detalhes da O.S | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50:  '#f0f7f4',
                        100: '#d9ede2',
                        200: '#b5dbc6',
                        300: '#84c1a3',
                        400: '#55a47e',
                        500: '#358764',
                        600: '#266c50',
                        700: '#1f5741',
                        800: '#1b4535',
                        900: '#17392c',
                        950: '#0c2019',
                    },
                    accent: {
                        50:  '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.04)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <style>body{background-color:#0f172a;} :root:not(.dark) body{background-color:#f9fafb;} .app-container{width:100%;max-width:430px;height:100vh;margin:0 auto;position:relative;overflow-y:auto;}</style>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans antialiased transition-colors">
    <!-- Background Gradient Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-300/40 dark:bg-primary-900/40 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent-300/40 dark:bg-accent-800/20 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>

    <div class="app-container bg-white dark:bg-slate-900 flex flex-col shadow-2xl">
        <header class="px-4 py-4 flex items-center border-b border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 sticky top-0 z-10">
            <a href="javascript:history.back()" class="p-2 -ml-2 text-slate-500 dark:text-slate-400 hover:text-slate-900"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
            <h1 class="text-lg font-semibold ml-2" id="headerTitle">OS #0000</h1>
        </header>

        <main class="flex-1 relative z-10 p-6">
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-3 flex-wrap">
                    <span id="priorityBadge" class="inline-block px-3 py-1 rounded text-xs font-bold uppercase tracking-wider border">SLA</span>
                    <span id="statusBadge" class="inline-block px-3 py-1 rounded text-xs font-bold uppercase tracking-wider border">Status</span>
                    <span id="refacaoBadge" class="hidden inline-block px-3 py-1 rounded text-xs font-bold uppercase tracking-wider border border-red-200 bg-red-100 text-red-700">Refacao</span>
                </div>
                <h2 id="ticketTitle" class="text-2xl font-bold text-slate-900 dark:text-white leading-tight mb-2">Carregando...</h2>
                <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 text-sm mb-2">
                    <i data-lucide="map-pin" class="w-4 h-4"></i> <span id="ticketLocation"></span>
                </div>
                <p id="ticketDescription" class="text-sm text-slate-500 dark:text-slate-400"></p>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-5">
                <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200/60 dark:border-slate-700">
                    <div class="text-[10px] uppercase text-slate-500 mb-1">Espera</div>
                    <div class="text-sm font-bold" id="timeToStartLabel">0 min</div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200/60 dark:border-slate-700">
                    <div class="text-[10px] uppercase text-slate-500 mb-1">Execucao</div>
                    <div class="text-sm font-bold" id="executionLabel">0 min</div>
                </div>
                <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200/60 dark:border-slate-700">
                    <div class="text-[10px] uppercase text-slate-500 mb-1">Revisao</div>
                    <div class="text-sm font-bold" id="reviewLabel">0 min</div>
                </div>
            </div>

            <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-5 mb-5 border border-slate-200/60 dark:border-slate-700 shadow-[0_2px_20px_rgb(0,0,0,0.04)]">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-semibold text-slate-500 uppercase">Cronometro de Execucao</h3>
                    <span id="statusPill" class="text-[10px] uppercase tracking-wide px-2 py-1 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">Pausado</span>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <p id="timerDisplay" class="text-4xl font-mono font-light text-slate-900 dark:text-slate-200 tracking-widest">00:00</p>
                        <p id="statusMsg" class="text-xs text-slate-500 mt-1 font-semibold">Aguardando acao.</p>
                    </div>
                    <button id="toggleTimerBtn" class="bg-primary-600 p-4 rounded-full text-white shadow-lg shadow-primary-500/30">
                        <i id="timerIcon" data-lucide="play" class="w-6 h-6 ml-1"></i>
                    </button>
                </div>
            </div>

            <div id="materialsPreview" class="hidden bg-orange-50 dark:bg-orange-500/10 border border-orange-200 dark:border-orange-500/20 rounded-2xl p-4 mb-5">
                <p class="text-xs font-semibold uppercase tracking-wide text-orange-700 dark:text-orange-300 mb-2">Materiais informados</p>
                <div id="materialsList" class="text-sm text-orange-900 dark:text-orange-100 space-y-1"></div>
            </div>

            <div class="mb-5">
                <h3 class="text-sm font-semibold mb-4 text-slate-800 dark:text-slate-200 flex items-center gap-2">
                    <i data-lucide="message-square" class="w-4 h-4 text-primary-500"></i> Chat da O.S.
                </h3>
                <div id="commentsList" class="space-y-3 mb-4"></div>
                <div id="commentComposer" class="flex items-center gap-2">
                    <input id="commentInput" type="text" placeholder="Registrar comentario operacional..." class="flex-1 bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-full py-2.5 px-4 text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:border-primary-500">
                    <button id="sendCommentBtn" type="button" class="bg-primary-600 hover:bg-primary-500 text-white w-10 h-10 rounded-full flex items-center justify-center transition-transform active:scale-95 shrink-0 shadow-md">
                        <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-3">
                <a id="resolveLink" href="#" class="block w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl text-center shadow-lg active:scale-95 transition-transform">
                    Marcar como Resolvido
                </a>
                <button id="reviewStartBtn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg">Iniciar Revisao</button>
                <button id="reviewApproveBtn" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg">Aprovar Revisao</button>
                <button id="reviewRejectBtn" class="hidden w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl shadow-lg">Solicitar Refacao</button>
            </div>
        </main>
    </div>

    <script>
        const user = MockDB.requireLogin();
        const params = new URLSearchParams(window.location.search);
        const ticketId = Number(params.get('ticketId'));
        let currentTicket = MockDB.getTicketById(ticketId);
        let timerInterval;

        if (!currentTicket) {
            alert('O.S nao encontrada.');
            window.location.href = 'mobile_app.html';
        }

        const display = document.getElementById('timerDisplay');
        const btn = document.getElementById('toggleTimerBtn');
        const icon = document.getElementById('timerIcon');
        const statusMsg = document.getElementById('statusMsg');
        const statusPill = document.getElementById('statusPill');
        const resolveLink = document.getElementById('resolveLink');
        const reviewStartBtn = document.getElementById('reviewStartBtn');
        const reviewApproveBtn = document.getElementById('reviewApproveBtn');
        const reviewRejectBtn = document.getElementById('reviewRejectBtn');

        function formatClock(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function formatDuration(ms) {
            if (!ms) return '0 min';
            const totalMin = Math.floor(ms / 60000);
            if (totalMin < 60) return `${totalMin} min`;
            const hours = Math.floor(totalMin / 60);
            const minutes = totalMin % 60;
            return `${hours}h ${minutes}min`;
        }

        function currentCommentsHtml(ticket) {
            const db = MockDB.get();
            const comments = MockDB.getTicketComments(ticket.id);
            if (!comments.length) {
                return `<div class="text-sm text-slate-500">Nenhum comentario registrado ainda.</div>`;
            }
            return comments.map(comment => {
                const author = db.users.find(entry => entry.id === comment.authorId);
                const mine = author?.id === user.id;
                return `
                    <div class="flex gap-3 ${mine ? '' : 'flex-row-reverse'}">
                        <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center shrink-0">
                            <span class="text-[10px] font-bold text-slate-600 dark:text-slate-300">${author ? author.name.substring(0, 2).toUpperCase() : 'SY'}</span>
                        </div>
                        <div class="${mine ? 'bg-primary-50 dark:bg-primary-500/10 border-primary-100 dark:border-primary-500/30 rounded-tl-none' : 'bg-white/60 dark:bg-slate-800/60 backdrop-blur-3xl backdrop-saturate-[2.5] border-white/40 dark:border-white/10 dark:border-slate-700 rounded-tr-none'} border p-3 rounded-2xl w-full shadow-[0_2px_20px_rgb(0,0,0,0.04)] text-sm">
                            <p class="text-slate-800 dark:text-slate-200 mb-1">${comment.content}</p>
                            <span class="text-[10px] text-slate-400 uppercase">${author?.name || 'Sistema'} • ${new Date(comment.time).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function refreshState() {
            currentTicket = MockDB.getTicketById(ticketId);
            const clock = MockDB.getTicketClock(ticketId);
            const durations = MockDB.getTicketDurations(ticketId) || {};
            const db = MockDB.get();
            const inventoryMap = new Map(db.inventory.map(item => [item.id, item]));
            const isExecutor = currentTicket.assignedTo === user.id;
            const isReviewer = currentTicket.reviewerId === user.id;
            const canComment = ['admin_geral', 'admin_manutencao'].includes(user.role) || isExecutor || isReviewer;

            document.getElementById('headerTitle').textContent = `OS #${currentTicket.id}`;
            document.getElementById('ticketTitle').textContent = currentTicket.title;
            document.getElementById('ticketLocation').textContent = currentTicket.location;
            document.getElementById('ticketDescription').textContent = currentTicket.description || 'Sem observacoes adicionais.';
            document.getElementById('priorityBadge').className = `inline-block px-3 py-1 rounded text-xs font-bold uppercase tracking-wider border ${currentTicket.priority === 'critical' ? 'bg-red-100 text-red-600 border-red-200' : 'bg-primary-100 text-primary-700 border-primary-200'}`;
            document.getElementById('priorityBadge').textContent = currentTicket.priority === 'critical' ? 'SLA Critico' : 'SLA Normal';
            document.getElementById('statusBadge').className = 'inline-block px-3 py-1 rounded text-xs font-bold uppercase tracking-wider border border-slate-200 bg-slate-100 text-slate-700';
            document.getElementById('statusBadge').textContent = currentTicket.status.replaceAll('_', ' ');
            document.getElementById('refacaoBadge').classList.toggle('hidden', currentTicket.refacaoNumero <= 0);
            document.getElementById('refacaoBadge').textContent = `Refacao #${currentTicket.refacaoNumero}`;

            document.getElementById('timeToStartLabel').textContent = formatDuration(durations.timeToStartMs);
            document.getElementById('executionLabel').textContent = formatDuration(durations.executionMs);
            document.getElementById('reviewLabel').textContent = formatDuration(durations.reviewMs);
            display.textContent = formatClock(clock.elapsedMs);
            document.getElementById('commentsList').innerHTML = currentCommentsHtml(currentTicket);

            const isRunning = clock.isRunning;
            icon.setAttribute('data-lucide', isRunning ? 'square' : 'play');
            btn.classList.toggle('bg-rose-500', isRunning);
            btn.classList.toggle('bg-primary-600', !isRunning);
            btn.disabled = !(isExecutor && ['designated', 'in_progress'].includes(currentTicket.status));
            btn.classList.toggle('opacity-50', btn.disabled);
            btn.classList.toggle('cursor-not-allowed', btn.disabled);

            const commentComposer = document.getElementById('commentComposer');
            commentComposer.classList.toggle('hidden', !canComment);

            reviewStartBtn.classList.add('hidden');
            reviewApproveBtn.classList.add('hidden');
            reviewRejectBtn.classList.add('hidden');

            if (currentTicket.status === 'designated') {
                statusPill.className = 'text-[10px] uppercase tracking-wide px-2 py-1 rounded-full bg-amber-100 text-amber-700';
                statusPill.textContent = 'Designada';
                statusMsg.textContent = isExecutor ? 'Inicie manualmente para comecar a execucao.' : 'Aguardando inicio do executor.';
                resolveLink.textContent = 'Registrar materiais';
                resolveLink.href = `mobile_checkout.html?ticketId=${currentTicket.id}`;
            } else if (currentTicket.status === 'in_progress') {
                statusPill.className = 'text-[10px] uppercase tracking-wide px-2 py-1 rounded-full bg-primary-100 text-primary-700';
                statusPill.textContent = 'Em execucao';
                statusMsg.textContent = 'Execucao em andamento.';
                resolveLink.textContent = 'Marcar como Resolvido';
                resolveLink.href = `mobile_checkout.html?ticketId=${currentTicket.id}`;
            } else if (currentTicket.status === 'awaiting_review') {
                statusPill.className = 'text-[10px] uppercase tracking-wide px-2 py-1 rounded-full bg-blue-100 text-blue-700';
                statusPill.textContent = 'Aguardando revisao';
                statusMsg.textContent = isReviewer
                    ? (currentTicket.reviewState === 'in_review' ? 'Revisao em andamento.' : 'Sua revisao esta pendente.')
                    : 'Aguardando validacao do revisor.';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                resolveLink.textContent = 'Voltar para fila';
                resolveLink.href = 'mobile_app.html';
                if (isReviewer) {
                    if (currentTicket.reviewState === 'in_review') {
                        reviewApproveBtn.classList.remove('hidden');
                        reviewRejectBtn.classList.remove('hidden');
                    } else {
                        reviewStartBtn.classList.remove('hidden');
                    }
                }
            } else if (currentTicket.status === 'completed') {
                statusPill.className = 'text-[10px] uppercase tracking-wide px-2 py-1 rounded-full bg-emerald-100 text-emerald-700';
                statusPill.textContent = 'Concluida';
                statusMsg.textContent = currentTicket.inventoryApproved || !currentTicket.materialsUsed.length ? 'OS encerrada e conciliada.' : 'OS concluida. Estoque ainda pendente.';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                resolveLink.textContent = 'Voltar para fila';
                resolveLink.href = 'mobile_app.html';
            } else {
                statusPill.className = 'text-[10px] uppercase tracking-wide px-2 py-1 rounded-full bg-slate-200 text-slate-600';
                statusPill.textContent = 'Nova';
                statusMsg.textContent = 'Aguardando designacao da gestao.';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                resolveLink.textContent = 'Voltar para fila';
                resolveLink.href = 'mobile_app.html';
            }

            const materialsPreview = document.getElementById('materialsPreview');
            const materialsList = document.getElementById('materialsList');
            if (currentTicket.materialsUsed?.length) {
                materialsPreview.classList.remove('hidden');
                materialsList.innerHTML = currentTicket.materialsUsed.map(material => {
                    const item = inventoryMap.get(material.inventoryId);
                    return `<p>${material.quantity}x ${item ? item.name : 'Item removido'}</p>`;
                }).join('');
            } else {
                materialsPreview.classList.add('hidden');
            }

            lucide.createIcons();
        }

        resolveLink.addEventListener('click', event => {
            const canGoToCheckout = currentTicket && currentTicket.assignedTo === user.id && ['designated', 'in_progress'].includes(currentTicket.status);
            if (!canGoToCheckout) return;
            event.preventDefault();
            window.location.href = `mobile_checkout.html?ticketId=${currentTicket.id}`;
        });

        btn.addEventListener('click', () => {
            MockDB.toggleTicketTimer(ticketId);
            refreshState();
        });

        reviewStartBtn.addEventListener('click', () => {
            const started = MockDB.startReview(ticketId, user.id);
            if (started) refreshState();
        });

        document.getElementById('sendCommentBtn').addEventListener('click', () => {
            const input = document.getElementById('commentInput');
            if (!input.value.trim()) return;
            const comment = MockDB.addTicketComment(ticketId, user.id, input.value.trim());
            if (comment) {
                input.value = '';
                refreshState();
            }
        });

        reviewApproveBtn.addEventListener('click', () => {
            MockDB.startReview(ticketId, user.id);
            MockDB.approveReview(ticketId, user.id, 'Revisao aprovada pelo revisor.');
            refreshState();
        });

        reviewRejectBtn.addEventListener('click', () => {
            const reason = prompt('Descreva o motivo da refacao:');
            if (reason === null) return;
            MockDB.startReview(ticketId, user.id);
            MockDB.rejectReview(ticketId, user.id, reason.trim() || 'Refacao solicitada pelo revisor.');
            refreshState();
        });

        refreshState();
        timerInterval = setInterval(refreshState, 1000);
    </script>
</body>
</html>
