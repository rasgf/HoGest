<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da O.S | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 900: '#0f172a', 800: '#1e293b' }, teal: { 600: '#0d9488' } } } } }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
    <style>body{background-color:#0f172a;} :root:not(.dark) body{background-color:#f9fafb;} .app-container{width:100%;max-width:430px;height:100vh;margin:0 auto;position:relative;overflow-y:auto;}</style>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans antialiased transition-colors">
    <div class="app-container bg-white dark:bg-slate-900 flex flex-col shadow-2xl">
        <header class="px-4 py-4 flex items-center border-b border-gray-200 dark:border-slate-800 bg-gray-50 dark:bg-slate-900 sticky top-0">
            <a href="mobile_app.html" class="p-2 -ml-2 text-slate-500 dark:text-slate-400 hover:text-slate-900"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
            <h1 class="text-lg font-semibold ml-2">OS #1095</h1>
        </header>

        <main class="flex-1 p-6">
            <div class="mb-6">
                <span class="inline-block bg-red-100 dark:bg-rose-500/20 text-red-600 dark:text-rose-400 border border-red-200 dark:border-rose-500/40 px-3 py-1 rounded text-xs font-bold uppercase tracking-wider mb-3">SLA CRÍTICO</span>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white leading-tight mb-2">Vazamento Chiller AC Central</h2>
                <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 text-sm">
                    <i data-lucide="map-pin" class="w-4 h-4"></i> Master Suite 05
                </div>
            </div>

            <div class="bg-gray-50 dark:bg-slate-800 rounded-xl p-5 mb-8 border border-gray-200 dark:border-slate-700 shadow-sm">
                <h3 class="text-xs font-semibold text-slate-500 uppercase mb-3">Cronômetro de Execução</h3>
                <div class="flex items-center justify-between">
                    <div>
                        <p id="timerDisplay" class="text-4xl font-mono font-light text-slate-900 dark:text-slate-200 tracking-widest">00:00</p>
                        <p id="statusMsg" class="text-xs text-slate-500 mt-1 font-semibold text-red-500">Pausado</p>
                    </div>
                    <button id="toggleTimerBtn" class="bg-teal-600 p-4 rounded-full text-white shadow-lg shadow-teal-500/30">
                        <i id="timerIcon" data-lucide="play" class="w-6 h-6 ml-1"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <a href="mobile_checkout.html" class="block w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 text-white font-bold py-4 rounded-xl text-center shadow-lg active:scale-95 transition-transform">
                    Marcar como Resolvido
                </a>
            </div>
        </main>
    </div>

    <!-- Timer Script Logic -->
    <script>
        lucide.createIcons();
        let timerInterval;
        let seconds = 0;
        let isRunning = false;
        
        const display = document.getElementById('timerDisplay');
        const btn = document.getElementById('toggleTimerBtn');
        const icon = document.getElementById('timerIcon');
        const statusMsg = document.getElementById('statusMsg');

        function updateDisplay() {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            display.textContent = `${m}:${s}`;
        }

        btn.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerInterval);
                icon.setAttribute('data-lucide', 'play');
                btn.classList.replace('bg-rose-500', 'bg-teal-600');
                statusMsg.textContent = 'Pausado (SLA Parado)';
                statusMsg.className = 'text-xs mt-1 font-semibold text-red-500';
            } else {
                timerInterval = setInterval(() => { seconds++; updateDisplay(); }, 1000);
                icon.setAttribute('data-lucide', 'square');
                btn.classList.replace('bg-teal-600', 'bg-rose-500');
                statusMsg.textContent = 'Trabalhando... (SLA Rodando)';
                statusMsg.className = 'text-xs mt-1 font-semibold text-teal-500';
            }
            isRunning = !isRunning;
            lucide.createIcons();
        });
    </script>
</body>
</html>
