<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>HotGest | Nova O.S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50:  '#f0f7f4',
                        100: '#d9ede2',
                        200: '#b5dbc6',
                        300: '#84c1a3',
                        400: '#55a47e',
                        500: '#358764',
                        600: '#266c50',
                        700: '#1f5741',
                        800: '#1b4535',
                        900: '#17392c',
                        950: '#0c2019',
                    },
                    accent: {
                        50:  '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.04)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <script>
        const user = MockDB.requireLogin(['trabalhador', 'controlador']);
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
    <style>body{background-color:#0f172a;} :root:not(.dark) body{background-color:#f9fafb;} .app-container{width:100%;max-width:430px;height:100vh;margin:0 auto;position:relative;overflow-y:auto;}</style>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans antialiased transition-colors">
    <div class="app-container bg-white dark:bg-slate-900 flex flex-col shadow-2xl">
        <header class="px-4 py-4 flex items-center border-b border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 sticky top-0 z-10 w-full transition-colors">
            <a href="mobile_app.html" class="p-2 -ml-2 text-slate-500 hover:text-slate-900 dark:hover:text-white"><i data-lucide="arrow-left" class="w-6 h-6"></i></a>
            <h1 class="text-lg font-semibold ml-2 text-slate-900 dark:text-white">Abertura Rapida</h1>
        </header>

        <main class="flex-1 relative z-10 p-6 pb-12 flex flex-col justify-between">
            <form id="newOsForm" class="space-y-6">
                <div>
                    <label class="block text-slate-500 text-xs font-semibold uppercase tracking-wide mb-3">1. Tipo de Relato</label>
                    <div class="grid grid-cols-3 gap-2" id="categoryGrid">
                        <button type="button" class="cat-btn active bg-slate-50 dark:bg-slate-800 border-2 border-primary-600 rounded-2xl p-3 text-center shadow-[0_0_10px_rgba(62,94,116,0.1)] flex flex-col items-center transition" data-lucide-name="wrench" data-title="Manutencao">
                            <i data-lucide="wrench" class="w-5 h-5 text-primary-600 dark:text-primary-400 mb-1 pointer-events-none"></i>
                            <span class="font-bold text-[10px] text-primary-700 dark:text-primary-400 pointer-events-none">Manutencao</span>
                        </button>
                        <button type="button" class="cat-btn bg-white dark:bg-slate-800/50 border border-slate-200/60 dark:border-slate-700 rounded-2xl p-3 text-center flex flex-col items-center transition" data-lucide-name="package-search" data-title="Achados / Perdidos">
                            <i data-lucide="package-search" class="w-5 h-5 text-slate-400 mb-1 pointer-events-none"></i>
                            <span class="font-medium text-[10px] text-slate-600 dark:text-slate-300 pointer-events-none">Achados / Perdidos</span>
                        </button>
                        <button type="button" class="cat-btn bg-white dark:bg-slate-800/50 border border-slate-200/60 dark:border-slate-700 rounded-2xl p-3 text-center flex flex-col items-center transition" data-lucide-name="spray-can" data-title="Limpeza Extra">
                            <i data-lucide="spray-can" class="w-5 h-5 text-slate-400 mb-1 pointer-events-none"></i>
                            <span class="font-medium text-[10px] text-slate-600 dark:text-slate-300 pointer-events-none">Limpeza Extra</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-500 text-xs font-semibold uppercase tracking-wide mb-3">2. Nivel de Urgencia</label>
                    <div class="flex bg-gray-100 dark:bg-slate-800 p-1 rounded-2xl" id="urgencyGrid">
                        <button type="button" class="urg-btn flex-1 text-center py-2 text-xs font-medium text-slate-500 rounded-lg outline-none transition" data-priority="low">Baixo</button>
                        <button type="button" class="urg-btn active flex-1 text-center py-2 text-xs font-medium bg-white dark:bg-slate-700 shadow text-slate-800 dark:text-white rounded-lg border border-slate-200/60 dark:border-slate-600 outline-none transition" data-priority="normal">Comum</button>
                        <button type="button" class="urg-btn flex-1 text-center py-2 text-xs font-bold text-red-500 dark:text-rose-400 rounded-lg outline-none transition" data-priority="critical">Critico</button>
                    </div>
                </div>

                <div>
                    <label for="titleInput" class="block text-slate-500 text-xs font-semibold uppercase tracking-wide mb-2">3. O que aconteceu?</label>
                    <input id="titleInput" maxlength="70" required class="w-full bg-slate-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-2xl py-4 px-4 text-slate-800 dark:text-white outline-none focus:border-primary-600 shadow-[0_2px_20px_rgb(0,0,0,0.04)]" placeholder="Ex: Vazamento no teto do quarto 204">
                </div>

                <div>
                    <label for="locationInput" class="block text-slate-500 text-xs font-semibold uppercase tracking-wide mb-2">4. Onde voce esta?</label>
                    <select id="locationInput" class="w-full bg-slate-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-2xl py-4 px-4 text-slate-800 dark:text-white outline-none focus:border-primary-600 shadow-[0_2px_20px_rgb(0,0,0,0.04)] appearance-none cursor-pointer">
                        <option>Master Suite 05</option>
                        <option>Recepcao Central</option>
                        <option>Ala Leste - Quarto 102</option>
                        <option>Lobby Principal</option>
                        <option>Restaurante Principal</option>
                    </select>
                </div>

                <div>
                    <label for="descriptionInput" class="block text-slate-500 text-xs font-semibold uppercase tracking-wide mb-2">5. Observacoes</label>
                    <textarea id="descriptionInput" rows="4" class="w-full bg-slate-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-2xl py-4 px-4 text-slate-800 dark:text-white outline-none focus:border-primary-600 shadow-[0_2px_20px_rgb(0,0,0,0.04)] resize-none" placeholder="Descreva rapido o problema. O suficiente para alguem agir."></textarea>
                </div>

                <p id="formFeedback" class="hidden text-sm rounded-2xl px-4 py-3 border"></p>
            </form>

            <div class="pt-8">
                <button id="submitBtn" class="block w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-4 rounded-2xl text-center active:scale-95 transition-transform shadow-lg">
                    Lancar no Sistema
                </button>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let selectedCategory = 'Manutencao';
        let selectedPriority = 'normal';

        const feedback = document.getElementById('formFeedback');
        const categoryButtons = document.querySelectorAll('.cat-btn');
        const urgencyButtons = document.querySelectorAll('.urg-btn');

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedCategory = btn.dataset.title;
                categoryButtons.forEach(button => {
                    button.classList.remove('active', 'bg-slate-50', 'dark:bg-slate-800', 'border-2', 'border-primary-600', 'shadow-[0_0_10px_rgba(62,94,116,0.1)]');
                    button.classList.add('bg-white', 'dark:bg-slate-800/50', 'border', 'border-slate-200/60', 'dark:border-slate-700');
                    const icon = button.querySelector('i');
                    const span = button.querySelector('span');
                    icon.className = `w-5 h-5 text-slate-400 mb-1 pointer-events-none lucide lucide-${button.dataset.lucideName}`;
                    span.className = 'font-medium text-[10px] text-slate-600 dark:text-slate-300 pointer-events-none';
                });

                btn.classList.remove('bg-white', 'dark:bg-slate-800/50', 'border', 'border-slate-200/60', 'dark:border-slate-700');
                btn.classList.add('active', 'bg-slate-50', 'dark:bg-slate-800', 'border-2', 'border-primary-600', 'shadow-[0_0_10px_rgba(62,94,116,0.1)]');
                btn.querySelector('i').className = `w-5 h-5 text-primary-600 dark:text-primary-400 mb-1 pointer-events-none lucide lucide-${btn.dataset.lucideName}`;
                btn.querySelector('span').className = 'font-bold text-[10px] text-primary-700 dark:text-primary-400 pointer-events-none';
            });
        });

        urgencyButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedPriority = btn.dataset.priority;
                urgencyButtons.forEach(button => {
                    button.classList.remove('active', 'bg-white', 'dark:bg-slate-700', 'shadow', 'border', 'border-slate-200/60', 'dark:border-slate-600', 'text-slate-800', 'dark:text-white');
                    if (button.dataset.priority === 'critical') {
                        button.classList.add('text-red-500', 'dark:text-rose-400', 'font-bold');
                    } else {
                        button.classList.add('text-slate-500', 'font-medium');
                    }
                });

                btn.classList.add('active', 'bg-white', 'dark:bg-slate-700', 'shadow', 'border', 'border-slate-200/60', 'dark:border-slate-600');
                if (btn.dataset.priority === 'critical') {
                    btn.classList.add('text-red-500', 'dark:text-rose-400');
                } else {
                    btn.classList.remove('text-slate-500');
                    btn.classList.add('text-slate-800', 'dark:text-white');
                }
            });
        });

        document.getElementById('submitBtn').addEventListener('click', () => {
            const title = document.getElementById('titleInput').value.trim();
            const location = document.getElementById('locationInput').value;
            const description = document.getElementById('descriptionInput').value.trim();

            if (!title) {
                feedback.className = 'text-sm rounded-2xl px-4 py-3 border border-red-200 bg-red-50 text-red-700';
                feedback.textContent = 'Descreva o problema em uma frase curta para abrir a O.S.';
                feedback.classList.remove('hidden');
                return;
            }

            const ticket = MockDB.createTicket({
                title,
                location,
                description,
                category: selectedCategory,
                priority: selectedPriority
            });

            feedback.className = 'text-sm rounded-2xl px-4 py-3 border border-primary-200 bg-primary-50 text-primary-700';
            feedback.textContent = `O.S #${ticket.id} criada com sucesso. O quadro operacional ja recebeu o chamado.`;
            feedback.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = `mobile_os_detail.html?ticketId=${ticket.id}`;
            }, 700);
        });
    </script>
</body>
</html>
