<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>Fechamento da O.S. | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50:  '#f0f7f4',
                        100: '#d9ede2',
                        200: '#b5dbc6',
                        300: '#84c1a3',
                        400: '#55a47e',
                        500: '#358764',
                        600: '#266c50',
                        700: '#1f5741',
                        800: '#1b4535',
                        900: '#17392c',
                        950: '#0c2019',
                    },
                    accent: {
                        50:  '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.04)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <style>
        body { background-color: #0f172a; }
        :root:not(.dark) body { background-color: #f8fafc; }
        .app-container { width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; overflow-y: auto; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans antialiased">
    <div class="app-container bg-white dark:bg-slate-900 flex flex-col shadow-2xl">
        <header class="px-4 py-4 flex items-center border-b border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 sticky top-0">
            <a id="backLink" href="mobile_app.html" class="p-2 -ml-2 text-slate-500 hover:text-slate-900 dark:hover:text-white">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div class="ml-2">
                <p class="text-xs uppercase tracking-[0.22em] text-slate-500">Fechamento</p>
                <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Concluir Execucao</h1>
            </div>
        </header>

        <main class="flex-1 relative z-10 p-6 flex flex-col justify-between gap-6">
            <div>
                <div class="bg-primary-50 dark:bg-primary-500/10 border border-primary-200 dark:border-primary-500/20 p-4 rounded-2xl mb-5">
                    <p class="text-sm text-primary-800 dark:text-primary-200">
                        Ao concluir, a O.S. segue para <strong>aguardando revisao</strong>. Se houver material utilizado, a auditoria de estoque ficara pendente para controlador ou administracao.
                    </p>
                </div>

                <div class="mb-6">
                    <p class="text-xs uppercase tracking-wide text-slate-500 mb-1">O.S.</p>
                    <h2 id="ticketTitle" class="text-xl font-bold text-slate-900 dark:text-white"></h2>
                    <p id="ticketLocation" class="text-sm text-slate-500 dark:text-slate-400"></p>
                </div>

                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base font-semibold text-slate-900 dark:text-white">Materiais Utilizados</h3>
                        <span class="text-xs text-slate-500">Opcional</span>
                    </div>

                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input id="searchInput" type="text" placeholder="Buscar material..." class="w-full bg-slate-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-2xl py-3 pl-10 pr-4 text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:border-primary-600">
                    </div>

                    <div id="inventoryOptions" class="space-y-3"></div>
                </div>
            </div>

            <div class="pt-4">
                <p id="checkoutFeedback" class="hidden text-sm rounded-2xl px-4 py-3 border mb-4"></p>
                <button id="completeBtn" class="block w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-4 rounded-2xl text-center active:scale-95 transition-transform shadow-lg">
                    Finalizar Execucao
                </button>
            </div>
        </main>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rawTicketId = params.get('ticketId');
        const ticketId = Number(rawTicketId);
        let ticket = Number.isFinite(ticketId) ? MockDB.getTicketById(ticketId) : null;

        function goToQueue() {
            window.location.href = 'mobile_app.html';
        }

        function goToDetail() {
            window.location.href = Number.isFinite(ticketId) ? `mobile_os_detail.html?ticketId=${ticketId}` : 'mobile_app.html';
        }

        if (!Number.isFinite(ticketId) || !ticket) {
            alert('O.S. nao encontrada.');
            goToQueue();
        }

        if (ticket && ticket.assignedTo !== user.id) {
            alert('Somente o executor designado pode concluir esta O.S.');
            goToDetail();
        }

        if (ticket) {
            document.getElementById('backLink').href = `mobile_os_detail.html?ticketId=${ticketId}`;
            document.getElementById('ticketTitle').textContent = `#${ticket.id} - ${ticket.title}`;
            document.getElementById('ticketLocation').textContent = ticket.location;
        }

        const feedback = document.getElementById('checkoutFeedback');
        const optionsContainer = document.getElementById('inventoryOptions');
        const searchInput = document.getElementById('searchInput');
        const suggestions = ticket ? MockDB.getInventorySuggestionsForTicket(ticket) : [];
        const selected = {};

        function renderOptions(filter = '') {
            const normalizedFilter = filter.toLowerCase();
            const visibleItems = suggestions.filter(item => item.name.toLowerCase().includes(normalizedFilter));

            optionsContainer.innerHTML = visibleItems.map(item => `
                <div class="flex items-center justify-between p-4 bg-white dark:bg-slate-800 rounded-2xl border ${selected[item.id] ? 'border-primary-500 dark:border-primary-600 shadow-[0_0_10px_rgba(62,94,116,0.12)]' : 'border-slate-200/60 dark:border-slate-700'}">
                    <div>
                        <p class="font-medium text-sm ${selected[item.id] ? 'text-primary-700 dark:text-slate-100' : 'text-slate-800 dark:text-slate-100'}">${item.name}</p>
                        <p class="text-xs text-slate-500 mt-0.5">${item.area} · Estoque atual ${item.stock} ${item.unit}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button type="button" data-action="decrease" data-id="${item.id}" class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-slate-700 border border-slate-200/60 dark:border-slate-600 flex items-center justify-center text-slate-500 dark:text-slate-300 font-bold">-</button>
                        <span class="font-mono text-base font-bold text-primary-600 dark:text-white min-w-4 text-center">${selected[item.id] || 0}</span>
                        <button type="button" data-action="increase" data-id="${item.id}" class="w-8 h-8 rounded-lg bg-primary-50 dark:bg-primary-600/20 border border-primary-200 dark:border-primary-500/50 flex items-center justify-center text-primary-600 dark:text-primary-400 font-bold">+</button>
                    </div>
                </div>
            `).join('') || '<div class="p-4 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl text-center text-sm text-slate-500">Nenhum material encontrado para esse filtro.</div>';
            lucide.createIcons();
        }

        optionsContainer.addEventListener('click', event => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const itemId = Number(button.dataset.id);
            const currentQty = selected[itemId] || 0;
            selected[itemId] = button.dataset.action === 'increase' ? currentQty + 1 : Math.max(0, currentQty - 1);
            renderOptions(searchInput.value);
        });

        searchInput.addEventListener('input', event => renderOptions(event.target.value));

        document.getElementById('completeBtn').addEventListener('click', () => {
            const materialsUsed = Object.entries(selected)
                .map(([inventoryId, quantity]) => ({
                    inventoryId: Number(inventoryId),
                    quantity: Number(quantity)
                }))
                .filter(item => item.quantity > 0);

            const completedTicket = MockDB.completeTicket(ticketId, materialsUsed);
            if (!completedTicket) {
                feedback.className = 'text-sm rounded-2xl px-4 py-3 border mb-4 border-red-200 bg-red-50 text-red-700';
                feedback.textContent = 'Nao foi possivel concluir a O.S. Confirme se voce ainda e o executor designado.';
                feedback.classList.remove('hidden');
                return;
            }

            feedback.className = 'text-sm rounded-2xl px-4 py-3 border mb-4 border-primary-200 bg-primary-50 text-primary-700';
            feedback.textContent = materialsUsed.length
                ? 'Execucao concluida. A O.S. esta aguardando revisao e a baixa de material ficou pendente para auditoria.'
                : 'Execucao concluida. A O.S. esta aguardando revisao.';
            feedback.classList.remove('hidden');

            setTimeout(() => {
                goToQueue();
            }, 900);
        });

        renderOptions();
        lucide.createIcons();
    </script>
</body>
</html>
