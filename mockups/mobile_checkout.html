<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>Fechamento da O.S. | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#f4f6f8',
                        100: '#e4ebf0',
                        200: '#c5d5df',
                        300: '#9cb5c5',
                        400: '#6c90a6',
                        500: '#4f768e',
                        600: '#3e5e74',
                        700: '#334b5e',
                        800: '#2d404f',
                        900: '#212E3C',
                        950: '#1a242d',
                    },
                    accent: {
                        50: '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.2), inset 1px 0 0 0 rgba(255, 0, 0, 0.05), inset -1px 0 0 0 rgba(0, 0, 255, 0.05), 0 20px 40px 0 rgba(0, 0, 0, 0.1)',
                    'dark-glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05), inset 1px 0 0 0 rgba(255, 0, 0, 0.1), inset -1px 0 0 0 rgba(0, 200, 255, 0.1), 0 20px 40px 0 rgba(0, 0, 0, 0.5)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                },
                animation: {
                    'blob': 'blob 14s infinite alternate',
                    'blob-reverse': 'blob-reverse 18s infinite alternate',
                },
                keyframes: {
                    blob: {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(80px, -100px) scale(1.2)' },
                        '66%': { transform: 'translate(-40px, 40px) scale(0.8)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    },
                    'blob-reverse': {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(-80px, 100px) scale(1.1)' },
                        '66%': { transform: 'translate(40px, -40px) scale(0.9)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    }
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    // Dynamic Liquid Hover Effect
    document.addEventListener('DOMContentLoaded', () => {
        const attachLiquidGlow = () => {
            document.querySelectorAll('.liquid-card').forEach(card => {
                if(card.dataset.liquidInjected) return;
                card.dataset.liquidInjected = "true";
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });
        };
        attachLiquidGlow();
        
        // Re-attach periodically in case of dynamic DOM loads 
        setInterval(attachLiquidGlow, 1000);
    });
    </script>
    <style>
        .liquid-card {
            position: relative;
            overflow: hidden;
        }
        .liquid-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.12), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }
        .dark .liquid-card::before {
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.06), transparent 40%);
        }
        .liquid-card:hover::before {
            opacity: 1;
        }
        /* Ensure content sits above the pseudo glow */
        .liquid-card > * {
            position: relative;
            z-index: 10;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <style>
        body { background-color: #0f172a; }
        :root:not(.dark) body { background-color: #f8fafc; }
        .app-container { width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; overflow-y: auto; }
    </style>

    <!-- Apple Liquid Glass CSS Engine (Hardware Accelerated) -->
    <style>
    .apple-liquid-glass {
        position: relative;
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
        border: 1px solid rgba(255,255,255,0.4);
        border-top: 1px solid rgba(255, 255, 255, 0.8);
        border-left: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,0,255,0.05), 0 24px 40px rgba(0,0,0,0.08);
        
        /* GPU Acceleration to fix Firefox Lag / Hover Delays */
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        will-change: transform, backdrop-filter;
    }
    html.dark .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.5) 0%, rgba(20, 20, 30, 0.2) 100%);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-left: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,200,255,0.05), 0 24px 40px rgba(0,0,0,0.4);
    }
    .apple-liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
        pointer-events: none;
        z-index: 10;
        opacity: 0.8;
    }
    html.dark .apple-liquid-glass::after {
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
    }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 font-sans antialiased">



    <!-- Animated Mesh Gradient Mesh (Enterprise) -->
    <div class="fixed top-[-20%] left-[-10%] w-[70vw] h-[70vh] rounded-full bg-primary-200/50 dark:bg-primary-900/40 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob"></div>
    <div class="fixed top-[20%] right-[-10%] w-[40vw] h-[50vh] rounded-full bg-accent-200/30 dark:bg-accent-900/40 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob-reverse" style="animation-delay: 2s;"></div>
    <div class="fixed bottom-[-20%] left-[20%] w-[50vw] h-[50vh] rounded-full bg-primary-300/30 dark:bg-primary-800/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob" style="animation-delay: 4s;"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[60%] rounded-full bg-gradient-to-tl from-rose-300/30 via-yellow-200/20 to-transparent dark:from-amber-900/40 dark:via-orange-900/20 blur-[120px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent-300/40 dark:bg-accent-800/20 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>

    <div class="app-container bg-white dark:bg-slate-900 flex flex-col shadow-2xl">
        <header class="px-4 py-4 flex items-center border-b border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 backdrop-blur-xl sticky top-0">
            <a id="backLink" href="mobile_app.html" class="p-2 -ml-2 text-slate-500 hover:text-slate-900 dark:hover:text-white">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <div class="ml-2">
                <p class="text-xs uppercase tracking-[0.22em] text-slate-500">Fechamento</p>
                <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Concluir Execucao</h1>
            </div>
        </header>

        <main class="flex-1 relative z-10 p-6 flex flex-col justify-between gap-6">
            <div>
                <div class="bg-primary-50 dark:bg-primary-500/10 border border-primary-200 dark:border-primary-500/20 p-4 rounded-2xl mb-5">
                    <p class="text-sm text-primary-800 dark:text-primary-200">
                        Ao concluir, a O.S. segue para <strong>aguardando revisao</strong>. Se houver material utilizado, a auditoria de estoque ficara pendente para controlador ou administracao.
                    </p>
                </div>

                <div class="mb-6">
                    <p class="text-xs uppercase tracking-wide text-slate-500 mb-1">O.S.</p>
                    <h2 id="ticketTitle" class="text-xl font-bold text-slate-900 dark:text-white"></h2>
                    <p id="ticketLocation" class="text-sm text-slate-500 dark:text-slate-400"></p>
                </div>

                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base font-semibold text-slate-900 dark:text-white">Materiais Utilizados</h3>
                        <span class="text-xs text-slate-500">Opcional</span>
                    </div>

                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input id="searchInput" type="text" placeholder="Buscar material..." class="w-full bg-slate-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-2xl py-3 pl-10 pr-4 text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:border-primary-600">
                    </div>

                    <div id="inventoryOptions" class="space-y-3"></div>
                </div>
            </div>

            <div class="pt-4">
                <p id="checkoutFeedback" class="hidden text-sm rounded-2xl px-4 py-3 border mb-4"></p>
                <button id="completeBtn" class="block w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-4 rounded-2xl text-center active:scale-95 transition-transform shadow-lg">
                    Finalizar Execucao
                </button>
            </div>
        </main>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rawTicketId = params.get('ticketId');
        const ticketId = Number(rawTicketId);
        let ticket = Number.isFinite(ticketId) ? MockDB.getTicketById(ticketId) : null;

        function goToQueue() {
            window.location.href = 'mobile_app.html';
        }

        function goToDetail() {
            window.location.href = Number.isFinite(ticketId) ? `mobile_os_detail.html?ticketId=${ticketId}` : 'mobile_app.html';
        }

        if (!Number.isFinite(ticketId) || !ticket) {
            alert('O.S. nao encontrada.');
            goToQueue();
        }

        if (ticket && ticket.assignedTo !== user.id) {
            alert('Somente o executor designado pode concluir esta O.S.');
            goToDetail();
        }

        if (ticket) {
            document.getElementById('backLink').href = `mobile_os_detail.html?ticketId=${ticketId}`;
            document.getElementById('ticketTitle').textContent = `#${ticket.id} - ${ticket.title}`;
            document.getElementById('ticketLocation').textContent = ticket.location;
        }

        const feedback = document.getElementById('checkoutFeedback');
        const optionsContainer = document.getElementById('inventoryOptions');
        const searchInput = document.getElementById('searchInput');
        const suggestions = ticket ? MockDB.getInventorySuggestionsForTicket(ticket) : [];
        const selected = {};

        function renderOptions(filter = '') {
            const normalizedFilter = filter.toLowerCase();
            const visibleItems = suggestions.filter(item => item.name.toLowerCase().includes(normalizedFilter));

            optionsContainer.innerHTML = visibleItems.map(item => `
                <div class="flex items-center justify-between p-4 liquid-card apple-liquid-glass rounded-2xl border ${selected[item.id] ? 'border-primary-500 dark:border-primary-600 shadow-[0_0_10px_rgba(62,94,116,0.12)]' : 'border-white/60 dark:border-slate-700/80'}">
                    <div>
                        <p class="font-medium text-sm ${selected[item.id] ? 'text-primary-700 dark:text-slate-100' : 'text-slate-800 dark:text-slate-100'}">${item.name}</p>
                        <p class="text-xs text-slate-500 mt-0.5">${item.area} · Estoque atual ${item.stock} ${item.unit}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button type="button" data-action="decrease" data-id="${item.id}" class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-slate-700 border border-slate-200/60 dark:border-slate-600 flex items-center justify-center text-slate-500 dark:text-slate-300 font-bold">-</button>
                        <span class="font-mono text-base font-bold text-primary-600 dark:text-white min-w-4 text-center">${selected[item.id] || 0}</span>
                        <button type="button" data-action="increase" data-id="${item.id}" class="w-8 h-8 rounded-lg bg-primary-50 dark:bg-primary-600/20 border border-primary-200 dark:border-primary-500/50 flex items-center justify-center text-primary-600 dark:text-primary-400 font-bold">+</button>
                    </div>
                </div>
            `).join('') || '<div class="p-4 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl text-center text-sm text-slate-500">Nenhum material encontrado para esse filtro.</div>';
            lucide.createIcons();
        }

        optionsContainer.addEventListener('click', event => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const itemId = Number(button.dataset.id);
            const currentQty = selected[itemId] || 0;
            selected[itemId] = button.dataset.action === 'increase' ? currentQty + 1 : Math.max(0, currentQty - 1);
            renderOptions(searchInput.value);
        });

        searchInput.addEventListener('input', event => renderOptions(event.target.value));

        document.getElementById('completeBtn').addEventListener('click', () => {
            const materialsUsed = Object.entries(selected)
                .map(([inventoryId, quantity]) => ({
                    inventoryId: Number(inventoryId),
                    quantity: Number(quantity)
                }))
                .filter(item => item.quantity > 0);

            const completedTicket = MockDB.completeTicket(ticketId, materialsUsed);
            if (!completedTicket) {
                feedback.className = 'text-sm rounded-2xl px-4 py-3 border mb-4 border-red-200 bg-red-50 text-red-700';
                feedback.textContent = 'Nao foi possivel concluir a O.S. Confirme se voce ainda e o executor designado.';
                feedback.classList.remove('hidden');
                return;
            }

            feedback.className = 'text-sm rounded-2xl px-4 py-3 border mb-4 border-primary-200 bg-primary-50 text-primary-700';
            feedback.textContent = materialsUsed.length
                ? 'Execucao concluida. A O.S. esta aguardando revisao e a baixa de material ficou pendente para auditoria.'
                : 'Execucao concluida. A O.S. esta aguardando revisao.';
            feedback.classList.remove('hidden');

            setTimeout(() => {
                goToQueue();
            }, 900);
        });

        renderOptions();
        lucide.createIcons();
    </script>
</body>
</html>
