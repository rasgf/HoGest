<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Manutenção | Equipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50:  '#f0f7f4',
                        100: '#d9ede2',
                        200: '#b5dbc6',
                        300: '#84c1a3',
                        400: '#55a47e',
                        500: '#358764',
                        600: '#266c50',
                        700: '#1f5741',
                        800: '#1b4535',
                        900: '#17392c',
                        950: '#0c2019',
                    },
                    accent: {
                        50:  '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.04)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Tableau -->
    <header class="bg-white border-b border-gray-300 p-4 shadow-[0_2px_20px_rgb(0,0,0,0.04)] flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2">Dash Manutenção 2 <span class="text-sm font-normal text-slate-500">por Luiz</span></h1>
        </div>
        <div class="flex gap-4 items-center text-slate-600">
            <button class="hover:bg-gray-100 p-1.5 rounded"><i data-lucide="copy" class="w-5 h-5"></i></button>
            <button class="hover:bg-gray-100 p-1.5 rounded"><i data-lucide="star" class="w-5 h-5"></i></button>
            <button class="hover:bg-gray-100 p-1.5 rounded"><i data-lucide="share-2" class="w-5 h-5"></i></button>
            <button class="hover:bg-gray-100 p-1.5 rounded"><i data-lucide="download" class="w-5 h-5"></i></button>
            <button class="hover:bg-gray-100 p-1.5 rounded"><i data-lucide="info" class="w-5 h-5"></i></button>
            <a href="dashboard.html" class="ml-4 text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded font-bold">Voltar ao HotGest Geral</a>
        </div>
    </header>

    <!-- Toolbar Filters -->
    <div class="bg-white border-b border-slate-200/60 px-6 py-2 flex items-center justify-between shadow-[0_2px_20px_rgb(0,0,0,0.04)] sticky top-0 z-10">
        <div class="flex items-center gap-8 w-full max-w-6xl mx-auto">
            
            <div class="flex items-center gap-2 shrink-0">
                <svg width="40" height="40" viewBox="0 0 100 100" class="text-slate-800"><path d="M50 20 A 15 15 0 1 0 50 50 A 15 15 0 1 0 50 20 Z" stroke="currentColor" stroke-width="4" fill="none"/><path d="M20 70 Q 30 70 40 60 T 60 70 T 80 80" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/></svg>
            </div>

            <!-- Arrastar Filtro Data -->
            <div class="flex flex-col ml-4">
                <div class="flex justify-between items-center text-sm font-semibold mb-1">
                    <span class="text-slate-700">Data de abertura</span>
                    <i data-lucide="filter-x" class="w-4 h-4 text-red-400 cursor-pointer"></i>
                </div>
                <div class="flex justify-between text-xs text-slate-500 mb-1">
                    <span>01/07/2025</span>
                    <span>20/07/2025</span>
                </div>
                <div class="relative w-64 h-2 bg-gray-200 rounded-full mt-1">
                    <div class="absolute left-[30%] right-[10%] h-full bg-slate-400"></div>
                    <div class="absolute left-[30%] top-1/2 -translate-y-1/2 w-4 h-4 bg-white border border-gray-400 rounded-full shadow cursor-pointer -ml-2 rounded-r-none"></div>
                    <div class="absolute right-[10%] top-1/2 -translate-y-1/2 w-4 h-4 bg-white border border-gray-400 rounded-full shadow cursor-pointer -mr-2 rounded-l-none"></div>
                </div>
            </div>

            <div class="flex-1 text-center font-bold text-sm tracking-wide">
                ACOMPANHAMENTO DAS MÉTRICAS DE <br/> MANUTENÇÃO
            </div>

            <div class="flex flex-col gap-1 text-xs text-slate-600 font-medium">
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="status" checked class="accent-slate-700"> (Tudo)</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="status" class="accent-slate-700"> EXECUTADA</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="status" class="accent-slate-700"> PENDENTE</label>
            </div>

            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-700 mb-1">Classificação de priorida...</label>
                <select class="text-xs p-1 border border-gray-300 outline-none runded w-32 bg-white">
                    <option>(Tudo)</option>
                    <option>Alta</option>
                    <option>Crítica</option>
                </select>
            </div>

            <div class="font-light text-2xl tracking-tighter text-slate-700 flex ml-4">
                insól<span class="font-bold text-slate-900">ito</span>
            </div>

        </div>
    </div>

    <!-- Dash Grid -->
    <main class="flex-1 relative z-10 w-full max-w-6xl mx-auto p-4 flex gap-4 h-[75vh]">
        
        <div class="w-[45%] bg-white border border-gray-300 flex flex-col p-2">
            <h2 class="font-bold text-lg p-2 font-serif text-slate-800">Top Responsáveis por Volume de OS</h2>
            <div class="flex-1 relative w-full h-full pb-6">
                <canvas id="chartTopResponsaveis"></canvas>
            </div>
        </div>

        <div class="w-[55%] flex flex-col gap-4">
            <div class="bg-white border border-gray-300 p-2 h-[120px] flex flex-col">
                <h2 class="font-bold text-lg p-1 font-serif text-slate-800">Volume de OS por Status</h2>
                <div class="flex-1 relative w-full border-b border-gray-300 pb-2">
                    <canvas id="chartStatus"></canvas>
                </div>
            </div>

            <div class="bg-white border border-gray-300 flex-1 flex flex-col p-2 min-h-0">
                <h2 class="font-bold text-lg p-1 font-serif text-slate-800">Média de tempo de execução do chamado</h2>
                <div class="flex-1 relative w-full">
                    <canvas id="chartTempoExecucao"></canvas>
                </div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();

        Chart.defaults.font.family = 'Inter';
        Chart.defaults.color = '#475569';
        
        const bColors = { executada: '#4f81bd', pendente: '#f79646', alta: '#4f81bd', critica: '#e06666', projetos: '#93c47d' };

        // Top Responsáveis
        new Chart(document.getElementById('chartTopResponsaveis'), {
            type: 'bar',
            data: {
                labels: ['LUCAS DE OLIVEIRA', 'LUTHER RIBEIRO', 'DANIEL PAIVA', 'FLAVIO FERNANDES'],
                datasets: [
                    { label: 'PENDENTE', data: [14, 28, 9, 6], backgroundColor: bColors.pendente },
                    { label: 'EXECUTADA', data: [40, 7, 24, 16], backgroundColor: bColors.executada }
                ]
            },
            options: {
                indexAxis: 'y',
                maintainAspectRatio: false,
                responsive: true,
                scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 }, padding: 10 } } },
                plugins: { legend: { position: 'bottom', align: 'end', labels: { usePointStyle: true, boxWidth: 10 } } }
            }
        });

        // Status
        new Chart(document.getElementById('chartStatus'), {
            type: 'bar',
            data: { labels: ['EXECUTADA', 'PENDENTE'], datasets: [{ data: [90, 69], backgroundColor: [bColors.executada, bColors.pendente], barThickness: 15 }] },
            options: {
                indexAxis: 'y', maintainAspectRatio: false, responsive: true,
                scales: { x: { display: false }, y: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' }, color: '#64748b' } } },
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                animation: {
                    onComplete: function(ctx) {
                        const chart = ctx.chart; const ctxRender = chart.ctx;
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            meta.data.forEach((bar, index) => {
                                const data = dataset.data[index];
                                ctxRender.fillStyle = '#1e293b'; ctxRender.font = 'bold 12px Inter';
                                ctxRender.fillText(data, bar.x + 5, bar.y + 4);
                            });
                        });
                    }
                }
            }
        });

        // Execucao
        new Chart(document.getElementById('chartTempoExecucao'), {
            type: 'bar',
            data: {
                labels: ['LUCAS\nELÉTRICA', 'LUTHER\nHIDRÁULICA', 'DANIEL\nPAIVA', 'FLAVIO\nFERNANDES'],
                datasets: [
                    { label: 'Alta', data: [2.85, 9.52, 2.79, 3.45], backgroundColor: bColors.pendente },
                    { label: 'Média/Geral', data: [11.0, 14.0, null, null], backgroundColor: bColors.executada }
                ]
            },
            options: {
                maintainAspectRatio: false, responsive: true,
                scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0 } }, y: { stacked: false, display: false } },
                plugins: { legend: { display: false } },
                animation: {
                    onComplete: function(ctx) {
                        const chart = ctx.chart; const ctxRender = chart.ctx;
                        ctxRender.beginPath();
                        ctxRender.moveTo(chart.chartArea.left, chart.chartArea.bottom - 80);
                        ctxRender.lineTo(chart.chartArea.right, chart.chartArea.bottom - 80);
                        ctxRender.strokeStyle = '#94a3b8'; ctxRender.lineWidth = 1; ctxRender.stroke();
                        ctxRender.fillStyle = '#94a3b8'; ctxRender.font = '10px Inter';
                        ctxRender.fillText('Média', chart.chartArea.left, chart.chartArea.bottom - 85);
                    }
                }
            }
        });
    </script>
</body>
</html>
