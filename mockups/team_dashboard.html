    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#f4f6f8',
                        100: '#e4ebf0',
                        200: '#c5d5df',
                        300: '#9cb5c5',
                        400: '#6c90a6',
                        500: '#4f768e',
                        600: '#3e5e74',
                        700: '#334b5e',
                        800: '#2d404f',
                        900: '#212E3C',
                        950: '#1a242d',
                    },
                    accent: {
                        50: '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.2), inset 1px 0 0 0 rgba(255, 0, 0, 0.05), inset -1px 0 0 0 rgba(0, 0, 255, 0.05), 0 20px 40px 0 rgba(0, 0, 0, 0.1)',
                    'dark-glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05), inset 1px 0 0 0 rgba(255, 0, 0, 0.1), inset -1px 0 0 0 rgba(0, 200, 255, 0.1), 0 20px 40px 0 rgba(0, 0, 0, 0.5)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                },
                animation: {
                    'blob': 'blob 14s infinite alternate',
                    'blob-reverse': 'blob-reverse 18s infinite alternate',
                },
                keyframes: {
                    blob: {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(80px, -100px) scale(1.2)' },
                        '66%': { transform: 'translate(-40px, 40px) scale(0.8)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    },
                    'blob-reverse': {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(-80px, 100px) scale(1.1)' },
                        '66%': { transform: 'translate(40px, -40px) scale(0.9)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    }
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    // Dynamic Liquid Hover Effect
    document.addEventListener('DOMContentLoaded', () => {
        const attachLiquidGlow = () => {
            document.querySelectorAll('.liquid-card').forEach(card => {
                if(card.dataset.liquidInjected) return;
                card.dataset.liquidInjected = "true";
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });
        };
        attachLiquidGlow();
        
        // Re-attach periodically in case of dynamic DOM loads 
        setInterval(attachLiquidGlow, 1000);
    });
    </script>
    <style>
        .liquid-card {
            position: relative;
            overflow: hidden;
        }
        .liquid-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.12), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }
        .dark .liquid-card::before {
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.06), transparent 40%);
        }
        .liquid-card:hover::before {
            opacity: 1;
        }
        /* Ensure content sits above the pseudo glow */
        .liquid-card > * {
            position: relative;
            z-index: 10;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Apple Liquid Glass CSS Engine (Hardware Accelerated) -->
    <style>
    .apple-liquid-glass {
        position: relative;
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        /* Increased contrast for readability */
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.25) 100%); 
        border: 1px solid rgba(255,255,255,0.6);
        border-top: 1px solid rgba(255, 255, 255, 1);
        border-left: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: inset 0 1px 2px rgba(255,255,255,1), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,0,255,0.05), 0 24px 40px rgba(0,0,0,0.1);
        
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        will-change: transform, backdrop-filter;
    }
    html.dark .apple-liquid-glass {
        /* Increased dark mode contrast */
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.8) 0%, rgba(20, 20, 30, 0.45) 100%);
        border: 1px solid rgba(255,255,255,0.25);
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        border-left: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,200,255,0.05), 0 24px 40px rgba(0,0,0,0.6);
    }
    .apple-liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
        pointer-events: none;
        z-index: 10;
        opacity: 0.8;
    }
    html.dark .apple-liquid-glass::after {
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
    }
    /* Enforce strong textual contrast globally on these cards */
    .apple-liquid-glass .text-slate-500 {
        color: #475569 !important;
    }
    html.dark .apple-liquid-glass .text-slate-500 {
        color: #cbd5e1 !important;
    }
    .apple-liquid-glass .text-slate-400 {
        color: #64748b !important;
    }
    html.dark .apple-liquid-glass .text-slate-400 {
        color: #e2e8f0 !important;
    }
    </style>

</head>

    <script>
        lucide.createIcons();

        Chart.defaults.font.family = 'Inter';
        Chart.defaults.color = '#475569';
        
        const bColors = { executada: '#4f81bd', pendente: '#f79646', alta: '#4f81bd', critica: '#e06666', projetos: '#93c47d' };

        let chartTopResponsaveis, chartStatus, chartTempoExecucao;
        let currentStatusFilter = 'all';

        function applyTeamFilter(statusFilter) {
            if (statusFilter) {
                currentStatusFilter = statusFilter;
                document.querySelectorAll('.team-filter-btn').forEach(btn => {
                    btn.classList.remove('bg-white', 'dark:bg-slate-600', 'text-slate-900', 'dark:text-white', 'shadow-sm', 'active-filter');
                    btn.classList.add('text-slate-600', 'dark:text-slate-400');
                });
                const activeBtn = {
                    'all': 'filterBtnAll',
                    'completed': 'filterBtnDone',
                    'pending': 'filterBtnPend'
                }[statusFilter];
                const btn = document.getElementById(activeBtn);
                btn.classList.remove('text-slate-600', 'dark:text-slate-400');
                btn.classList.add('bg-white', 'dark:bg-slate-600', 'text-slate-900', 'dark:text-white', 'shadow-sm', 'active-filter');
            }
            renderTeamMetrics();
        }

        function renderTeamMetrics() {
            if (!window.db) window.db = MockDB.get();
            const db = window.db;
            
            const executors = MockDB.getExecutors();
            const execLabels = executors.map(e => e.name.split(' ')[0].toUpperCase());
            
            const priorityVal = document.getElementById('priorityFilter') ? document.getElementById('priorityFilter').value : 'all';
            
            let filteredTickets = db.tickets.filter(t => {
                if (currentStatusFilter === 'completed' && t.status !== 'completed') return false;
                if (currentStatusFilter === 'pending' && t.status === 'completed') return false;
                if (priorityVal !== 'all' && t.priority !== priorityVal) return false;
                return true;
            });
            
            const pendenteData = executors.map(e => filteredTickets.filter(t => t.assignedTo === e.id && t.status !== 'completed').length);
            const executadaData = executors.map(e => filteredTickets.filter(t => t.assignedTo === e.id && t.status === 'completed').length);

            // Chart 1: Top Responsáveis
            if (chartTopResponsaveis) chartTopResponsaveis.destroy();
            chartTopResponsaveis = new Chart(document.getElementById('chartTopResponsaveis'), {
                type: 'bar',
                data: {
                    labels: execLabels,
                    datasets: [
                        { label: 'PENDENTE', data: pendenteData, backgroundColor: bColors.pendente },
                        { label: 'EXECUTADA', data: executadaData, backgroundColor: bColors.executada }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    responsive: true,
                    scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 }, padding: 10 } } },
                    plugins: { legend: { position: 'bottom', align: 'end', labels: { usePointStyle: true, boxWidth: 10 } } }
                }
            });

            // Chart 2: Status Geral
            const totalExec = executadaData.reduce((a,b)=>a+b, 0);
            const totalPend = pendenteData.reduce((a,b)=>a+b, 0);
            if (chartStatus) chartStatus.destroy();
            chartStatus = new Chart(document.getElementById('chartStatus'), {
                type: 'bar',
                data: { labels: ['EXECUTADA', 'PENDENTE'], datasets: [{ data: [totalExec, totalPend], backgroundColor: [bColors.executada, bColors.pendente], barThickness: 15 }] },
                options: {
                    indexAxis: 'y', maintainAspectRatio: false, responsive: true,
                    scales: { x: { display: false }, y: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' }, color: '#64748b' } } },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    animation: {
                        onComplete: function(ctx) {
                            const chart = ctx.chart; const ctxRender = chart.ctx;
                            chart.data.datasets.forEach((dataset, i) => {
                                const meta = chart.getDatasetMeta(i);
                                meta.data.forEach((bar, index) => {
                                    const dataVal = dataset.data[index];
                                    const isDark = document.documentElement.classList.contains('dark');
                                    ctxRender.fillStyle = isDark ? '#f8fafc' : '#1e293b'; 
                                    ctxRender.font = 'bold 12px Inter';
                                    ctxRender.fillText(dataVal, bar.x + 5, bar.y + 4);
                                });
                            });
                        }
                    }
                }
            });

            // Chart 3: Tempo Média Execução
            // Realistic mock data using their labels, adding slight noise based on real ticket counts
            const tempoAlta = pendenteData.map(v => v > 0 ? (Math.random() * 5 + 1).toFixed(1) : 0);
            const tempoMedia = executadaData.map(v => v > 0 ? (Math.random() * 8 + 5).toFixed(1) : 0);
            
            if (chartTempoExecucao) chartTempoExecucao.destroy();
            chartTempoExecucao = new Chart(document.getElementById('chartTempoExecucao'), {
                type: 'bar',
                data: {
                    labels: execLabels,
                    datasets: [
                        { label: 'Alta', data: tempoAlta, backgroundColor: bColors.pendente },
                        { label: 'Média/Geral', data: tempoMedia, backgroundColor: bColors.executada }
                    ]
                },
                options: {
                    maintainAspectRatio: false, responsive: true,
                    scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0 } }, y: { stacked: false, display: false } },
                    plugins: { legend: { display: false } },
                    animation: {
                        onComplete: function(ctx) {
                            const chart = ctx.chart; const ctxRender = chart.ctx;
                            ctxRender.beginPath();
                            ctxRender.moveTo(chart.chartArea.left, chart.chartArea.bottom - 80);
                            ctxRender.lineTo(chart.chartArea.right, chart.chartArea.bottom - 80);
                            ctxRender.strokeStyle = '#94a3b8'; ctxRender.lineWidth = 1; ctxRender.stroke();
                            ctxRender.fillStyle = '#94a3b8'; ctxRender.font = '10px Inter';
                            ctxRender.fillText('Média', chart.chartArea.left, chart.chartArea.bottom - 85);
                        }
                    }
                }
            });
        }
        
        // Initialize MockDB and NavBar
        const user = MockDB.requireLogin();
        if (user) {
            MockDB.populateUserProfile(user);
            const sidebar = document.getElementById('sidebarNav');
            if (sidebar) sidebar.innerHTML = MockDB.buildDesktopNav(user, 'team_dashboard.html');

            const mobileSidebar = document.getElementById('mobileSidebarNav');
            if (mobileSidebar) mobileSidebar.innerHTML = MockDB.buildDesktopNav(user, 'team_dashboard.html');
            
            const mobInitials = document.getElementById('mobileUserInitials');
            if (mobInitials) mobInitials.textContent = user.name.substring(0,2).toUpperCase();
            
            const mobName = document.getElementById('mobileUserNameLabel');
            if (mobName) mobName.textContent = user.name;
            
            const mobRole = document.getElementById('mobileUserRoleLabel');
            if (mobRole) mobRole.textContent = user.role.toUpperCase().replace('_', ' ');
            
            lucide.createIcons();
            renderTeamMetrics();
        }

</script>
</main>
</body>
</html>
