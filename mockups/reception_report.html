    <title>Reportar Problema | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#f4f6f8',
                        100: '#e4ebf0',
                        200: '#c5d5df',
                        300: '#9cb5c5',
                        400: '#6c90a6',
                        500: '#4f768e',
                        600: '#3e5e74',
                        700: '#334b5e',
                        800: '#2d404f',
                        900: '#212E3C',
                        950: '#1a242d',
                    },
                    accent: {
                        50: '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.2), inset 1px 0 0 0 rgba(255, 0, 0, 0.05), inset -1px 0 0 0 rgba(0, 0, 255, 0.05), 0 20px 40px 0 rgba(0, 0, 0, 0.1)',
                    'dark-glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05), inset 1px 0 0 0 rgba(255, 0, 0, 0.1), inset -1px 0 0 0 rgba(0, 200, 255, 0.1), 0 20px 40px 0 rgba(0, 0, 0, 0.5)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                },
                animation: {
                    'blob': 'blob 14s infinite alternate',
                    'blob-reverse': 'blob-reverse 18s infinite alternate',
                },
                keyframes: {
                    blob: {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(80px, -100px) scale(1.2)' },
                        '66%': { transform: 'translate(-40px, 40px) scale(0.8)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    },
                    'blob-reverse': {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(-80px, 100px) scale(1.1)' },
                        '66%': { transform: 'translate(40px, -40px) scale(0.9)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    }
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    // Dynamic Liquid Hover Effect
    document.addEventListener('DOMContentLoaded', () => {
        const attachLiquidGlow = () => {
            document.querySelectorAll('.liquid-card').forEach(card => {
                if(card.dataset.liquidInjected) return;
                card.dataset.liquidInjected = "true";
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });
        };
        attachLiquidGlow();
        
        // Re-attach periodically in case of dynamic DOM loads 
        setInterval(attachLiquidGlow, 1000);
    });
    </script>
    <style>
        .liquid-card {
            position: relative;
            overflow: hidden;
        }
        .liquid-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.12), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }
        .dark .liquid-card::before {
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.06), transparent 40%);
        }
        .liquid-card:hover::before {
            opacity: 1;
        }
        /* Ensure content sits above the pseudo glow */
        .liquid-card > * {
            position: relative;
            z-index: 10;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>

    <!-- Apple Liquid Glass CSS Engine (Hardware Accelerated) -->
    <style>
    .apple-liquid-glass {
        position: relative;
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
        border: 1px solid rgba(255,255,255,0.4);
        border-top: 1px solid rgba(255, 255, 255, 0.8);
        border-left: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,0,255,0.05), 0 24px 40px rgba(0,0,0,0.08);
        
        /* GPU Acceleration to fix Firefox Lag / Hover Delays */
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        will-change: transform, backdrop-filter;
    }
    html.dark .apple-liquid-glass {
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.5) 0%, rgba(20, 20, 30, 0.2) 100%);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-left: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,200,255,0.05), 0 24px 40px rgba(0,0,0,0.4);
    }
    .apple-liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
        pointer-events: none;
        z-index: 10;
        opacity: 0.8;
    }
    html.dark .apple-liquid-glass::after {
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
    }
    </style>
</head>

    <main class="flex-1 relative z-10 flex flex-col h-screen overflow-hidden">

        <header class="h-16 border-b border-white/60 dark:border-slate-700/80 liquid-card apple-liquid-glass hidden md:flex justify-between items-center px-8 transition-colors duration-200">
            <h1 class="text-xl font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2"><i data-lucide="bell-ring" class="w-5 h-5 text-primary-600"></i> Reportar Problema</h1>

                <button onclick="MockDB.logout()" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 transition">
                    <span id="mobileUserName" class="text-xs font-medium text-slate-600 dark:text-slate-300 max-w-[80px] truncate"></span>

                </button>
            </div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 flex items-start md:items-center justify-center safe-bottom">
            <div class="w-full max-w-lg liquid-card apple-liquid-glass rounded-2xl border-t border-l border-white/60 dark:border-slate-700/80 p-5 md:p-8 shadow-[0_2px_20px_rgb(0,0,0,0.04)]">
                <div class="flex items-center gap-3 mb-1">
                    <div class="w-10 h-10 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center shrink-0">
                        <i data-lucide="bell-ring" class="w-5 h-5 text-primary-600 dark:text-primary-400"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg text-slate-900 dark:text-white">Nova Solicitação de O.S</h2>
                        <p class="text-xs text-slate-500">A manutenção será notificada imediatamente.</p>
                    </div>
                </div>
                <p class="text-sm text-slate-500 mb-5 mt-3">Preencha os dados básicos. A equipe de manutenção fará a curadoria e classificação da prioridade logo em seguida.</p>
                
                <form id="reportForm" class="space-y-4">
                    <div>
                        <label for="locationType" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Área do Problema</label>
                        <select id="locationType" class="w-full bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-gray-300 dark:border-slate-700 rounded-2xl p-3 outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-slate-800 dark:text-slate-200 transition" onchange="toggleRoomInput()">
                            <option value="">Selecione uma área...</option>
                            <option value="Recepção">Recepção / Lobby</option>
                            <option value="Piscina">Piscina / Área Externa</option>
                            <option value="Restaurante">Restaurante / Cozinha</option>
                            <option value="Quarto">Quarto de Hóspede</option>
                            <option value="Corredor">Corredores / Áreas Comuns</option>
                            <option value="Jardim">Jardim / Área Lazer</option>
                            <option value="Academia">Academia / Spa</option>
                            <option value="Estacionamento">Estacionamento</option>
                            <option value="Outro">Outro (Especificar)</option>
                        </select>
                    </div>

                    <div id="roomInputContainer" class="hidden">
                        <label for="roomNumber" class="block text-xs font-bold text-primary-600 dark:text-primary-400 uppercase tracking-wide mb-2">Número do Quarto / Localização Específica</label>
                        <input id="roomNumber" type="text" placeholder="Ex: 104, Master Suite 05, Corredor Ala Leste" class="w-full bg-primary-50 dark:bg-primary-900/20 border border-primary-200 dark:border-primary-700 rounded-2xl p-3 text-slate-800 dark:text-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition">
                    </div>

                    <div>
                        <label for="titleInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">O que aconteceu?</label>
                        <input id="titleInput" type="text" placeholder="Um breve resumo do problema" required class="w-full bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-gray-300 dark:border-slate-700 rounded-2xl p-3 text-slate-800 dark:text-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition">
                    </div>

                    <div>
                        <label for="descInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Detalhes (Opcional)</label>
                        <textarea id="descInput" rows="3" placeholder="Informações extras do hóspede, vazamento intenso, barulho..." class="w-full bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-gray-300 dark:border-slate-700 rounded-2xl p-3 text-slate-800 dark:text-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none resize-none transition"></textarea>

                    <p id="formFeedback" class="hidden text-sm rounded-2xl px-4 py-3 border"></p>

                    <button type="submit" class="w-full mt-2 bg-primary-600 hover:bg-primary-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all flex justify-center items-center gap-2 text-base">

    <script>
        const user = MockDB.requireLogin();
        if (user) {
            document.getElementById('sidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'reception_report.html');
            MockDB.populateUserProfile(user);
            populateMobileSidebar(user);
            
            // Mobile user name
            const firstName = user.name.split(' ')[0].split('-')[0].trim();
            document.getElementById('mobileUserName').textContent = firstName;

            lucide.createIcons();

            const selectEl = document.getElementById('locationType');

            if (user.role === 'recepcao') {
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="Recepção">Recepção / Lobby</option>
                    <option value="Quarto">Quarto de Hóspede</option>
                `;
            } else if (user.role === 'camareira') {
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="Quarto">Quarto de Hóspede</option>
                    <option value="Corredor">Corredores / Áreas Comuns</option>
                    <option value="Piscina">Piscina / Área Externa</option>
                    <option value="Restaurante">Restaurante / Refeitório</option>
                    <option value="Jardim">Jardim / Área de Lazer</option>
                    <option value="Academia">Academia / Spa</option>
                    <option value="Estacionamento">Estacionamento</option>
                `;
            } else if (user.role === 'trabalhador' && user.speciality) {
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="${user.speciality}">${user.speciality}</option>
                    <option value="Quarto">Quarto de Hóspede (${user.speciality})</option>
                `;
            }
        }

        function toggleRoomInput() {
            const locType = document.getElementById('locationType').value;
            const roomContainer = document.getElementById('roomInputContainer');
            const label = document.getElementById('roomNumber').previousElementSibling;
            
            const needsDetail = locType === 'Quarto' || locType === 'Corredor' || locType === 'Outro';
            const isCamareira = user && user.role === 'camareira';
            
            if (needsDetail || (isCamareira && locType !== '')) {
                roomContainer.classList.remove('hidden');
                if (locType === 'Quarto') {
                    label.textContent = 'Número do Quarto / Localização Específica';
                    document.getElementById('roomNumber').placeholder = 'Ex: 104, Master Suite 05';
                } else {
                    label.textContent = 'Localização Específica (Opcional)';
                    document.getElementById('roomNumber').placeholder = 'Ex: Piscina leste, Corredor Ala B, Jardim Bloco 2';
                }
                if (locType === 'Quarto') document.getElementById('roomNumber').focus();
            } else {
                roomContainer.classList.add('hidden');
            }
        }

        document.getElementById('reportForm').addEventListener('submit', event => {
            event.preventDefault();
            
            const locType = document.getElementById('locationType').value;
            let finalLocation = locType;
            if (locType === 'Quarto') {
                finalLocation = 'Quarto ' + document.getElementById('roomNumber').value;
            } else if (!locType) {
                alert("Por favor, selecione a área.");
                return;
            }

            MockDB.createTicket({
                title: document.getElementById('titleInput').value.trim(),
                location: finalLocation,
                priority: 'normal',
                category: 'Manutencao',
                description: document.getElementById('descInput').value.trim()
            });

            const feedback = document.getElementById('formFeedback');
            feedback.className = 'mt-4 text-sm rounded-2xl px-4 py-3 border border-green-200 bg-green-50 dark:bg-green-900/20 dark:border-green-800 text-green-700 dark:text-green-400';
            feedback.innerHTML = `<strong>Pronto!</strong> O chamado foi enviado e será avaliado pelo Gerente de Manutenção imediatamente.`;
            feedback.classList.remove('hidden');
            
            document.getElementById('reportForm').reset();
            toggleRoomInput();
            
            setTimeout(() => {
                feedback.classList.add('hidden');
            }, 5000);
        });
    
        // --- Mobile Sidebar ---
        function openMobileSidebar() {
            document.getElementById('mobileSidebarOverlay').classList.remove('hidden');
            requestAnimationFrame(() => {
                document.getElementById('mobileSidebar').classList.remove('-translate-x-full');
            });
        }
        function closeMobileSidebar() {
            document.getElementById('mobileSidebar').classList.add('-translate-x-full');
            setTimeout(() => document.getElementById('mobileSidebarOverlay').classList.add('hidden'), 300);
        }

        function populateMobileSidebar(user) {
            document.getElementById('mobileSidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'reception_report.html');
            document.getElementById('mobileUserInitials').textContent = user.name.substring(0,2).toUpperCase();
            document.getElementById('mobileUserNameLabel').textContent = user.name;
            document.getElementById('mobileUserRoleLabel').textContent = user.role.toUpperCase().replace('_', ' ');

            // Intercept notification links (mock navigation for prototype)
            document.querySelectorAll('#sidebarNav a, #mobileSidebarNav a').forEach(link => {
                if (link.href.includes('messages.html')) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = "dashboard.html?openNotif=true";
                    });
                }
            });
        }

</script>
</body>
