<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Problema | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 900: '#0f172a', 800: '#1e293b' }, teal: { 600: '#0d9488' } } } } }
    </script>
    <script>
        function toggleTheme() {
            const doc = document.documentElement;
            if (doc.classList.contains('dark')) { doc.classList.remove('dark'); localStorage.theme = 'light'; } 
            else { doc.classList.add('dark'); localStorage.theme = 'dark'; }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans antialiased min-h-screen flex transition-colors duration-200">
    
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col hidden md:flex transition-colors duration-200">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-slate-700">
            <span class="text-teal-600 dark:text-teal-500 font-bold tracking-widest text-xl">HOTGEST</span>
        </div>
        <nav id="sidebarNav" class="flex-1 py-6 px-4 space-y-2">
            <!-- Renderizado via JS -->
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-slate-700">
            <div class="flex items-center gap-3 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition" onclick="MockDB.logout()">
                <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                    <span id="userInitials" class="text-xs font-bold text-slate-600 dark:text-slate-300"></span>
                </div>
                <div>
                    <p id="userNameLabel" class="text-sm font-medium text-slate-800 dark:text-slate-200"></p>
                    <p id="userRoleLabel" class="text-xs text-slate-500 dark:text-slate-400 capitalize"></p>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 ml-auto text-slate-400"></i>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 border-b border-gray-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/50 backdrop-blur flex justify-between items-center px-8 transition-colors duration-200">
            <h1 class="text-xl font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2"><i data-lucide="bell-ring" class="w-5 h-5 text-teal-600"></i> Reportar Problema</h1>
            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400"><i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i></button>
        </header>

        <div class="flex-1 overflow-y-auto p-8 flex items-center justify-center">
            <div class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 p-8 shadow-sm">
                <h2 class="font-bold text-lg mb-2 text-slate-900 dark:text-white">Nova Solicitação de O.S</h2>
                <p class="text-sm text-slate-500 mb-6">Preencha os dados básicos. A equipe de manutenção fará a curadoria e classificação da prioridade logo em seguida.</p>
                
                <form id="reportForm" class="space-y-5">
                    <div>
                        <label for="locationType" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Área do Problema</label>
                        <select id="locationType" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg p-3 outline-none focus:border-teal-500 text-slate-800 dark:text-slate-200" onchange="toggleRoomInput()">
                            <option value="">Selecione uma área...</option>
                            <option value="Recepção">Recepção / Lobby</option>
                            <option value="Piscina">Piscina / Área Externa</option>
                            <option value="Restaurante">Restaurante / Cozinha</option>
                            <option value="Quarto">Quarto de Hóspede</option>
                            <option value="Corredor">Corredores / Áreas Comuns</option>
                            <option value="Jardim">Jardim / Área Lazer</option>
                            <option value="Academia">Academia / Spa</option>
                            <option value="Estacionamento">Estacionamento</option>
                            <option value="Outro">Outro (Especificar)</option>
                        </select>
                    </div>

                    <div id="roomInputContainer" class="hidden">
                        <label for="roomNumber" class="block text-xs font-bold text-teal-600 dark:text-teal-500 uppercase tracking-wide mb-2">Número do Quarto / Localização Específica</label>
                        <input id="roomNumber" type="text" placeholder="Ex: 104, Master Suite 05, Corredor Ala Leste" class="w-full bg-teal-50 dark:bg-teal-900/20 border border-teal-200 dark:border-teal-700 rounded-lg p-3 text-slate-800 dark:text-slate-200 focus:border-teal-500 outline-none">
                    </div>

                    <div>
                        <label for="titleInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">O que aconteceu?</label>
                        <input id="titleInput" type="text" placeholder="Um breve resumo do problema" required class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg p-3 text-slate-800 dark:text-slate-200 focus:border-teal-500 outline-none">
                    </div>

                    <div>
                        <label for="descInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Detalhes (Opcional)</label>
                        <textarea id="descInput" rows="3" placeholder="Informações extras do hóspede, vazamento intenso, barulho..." class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg p-3 text-slate-800 dark:text-slate-200 focus:border-teal-500 outline-none resize-none"></textarea>
                    </div>

                    <p id="formFeedback" class="hidden text-sm rounded-lg px-4 py-3 border"></p>

                    <button type="submit" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-bold py-3 rounded-lg shadow-md active:scale-95 transition-transform flex justify-center items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Enviar para Manutenção
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        
        const user = MockDB.requireLogin();
        if (user) {
            document.getElementById('sidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'reception_report.html');
            MockDB.populateUserProfile(user);

            const selectEl = document.getElementById('locationType');

            if (user.role === 'recepcao') {
                // Recepcionista: apenas Recepção e Quartos
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="Recepção">Recepção / Lobby</option>
                    <option value="Quarto">Quarto de Hóspede</option>
                `;
            } else if (user.role === 'camareira') {
                // Camareira: quartos e todas as áreas de hospedagem, sem recepção/técnicas
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="Quarto">Quarto de Hóspede</option>
                    <option value="Corredor">Corredores / Áreas Comuns</option>
                    <option value="Piscina">Piscina / Área Externa</option>
                    <option value="Restaurante">Restaurante / Refeitório</option>
                    <option value="Jardim">Jardim / Área de Lazer</option>
                    <option value="Academia">Academia / Spa</option>
                    <option value="Estacionamento">Estacionamento</option>
                `;
            } else if (user.role === 'trabalhador' && user.speciality) {
                // Executor: apenas sua especialidade técnica
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="${user.speciality}">${user.speciality}</option>
                    <option value="Quarto">Quarto de Hóspede (${user.speciality})</option>
                `;
            }
            // Admins e controladores: vêem todas as opções (select original mantido)
        }

        function toggleRoomInput() {
            const locType = document.getElementById('locationType').value;
            const roomContainer = document.getElementById('roomInputContainer');
            const label = document.getElementById('roomNumber').previousElementSibling;
            
            // Mostrar campo de especificação para Quarto sempre, 
            // e para camareira também em outras áreas que precisam de localização precisa
            const needsDetail = locType === 'Quarto' || locType === 'Corredor' || locType === 'Outro';
            const isCamareira = user && user.role === 'camareira';
            
            if (needsDetail || (isCamareira && locType !== '')) {
                roomContainer.classList.remove('hidden');
                if (locType === 'Quarto') {
                    label.textContent = 'Número do Quarto / Localização Específica';
                    document.getElementById('roomNumber').placeholder = 'Ex: 104, Master Suite 05';
                } else {
                    label.textContent = 'Localização Específica (Opcional)';
                    document.getElementById('roomNumber').placeholder = 'Ex: Piscina leste, Corredor Ala B, Jardim Bloco 2';
                }
                if (locType === 'Quarto') document.getElementById('roomNumber').focus();
            } else {
                roomContainer.classList.add('hidden');
            }
        }

        document.getElementById('reportForm').addEventListener('submit', event => {
            event.preventDefault();
            
            const locType = document.getElementById('locationType').value;
            let finalLocation = locType;
            if (locType === 'Quarto') {
                finalLocation = 'Quarto ' + document.getElementById('roomNumber').value;
            } else if (!locType) {
                alert("Por favor, selecione a área.");
                return;
            }

            MockDB.createTicket({
                title: document.getElementById('titleInput').value.trim(),
                location: finalLocation,
                priority: 'normal',
                category: 'Manutencao',
                description: document.getElementById('descInput').value.trim()
            });

            const feedback = document.getElementById('formFeedback');
            feedback.className = 'mt-4 text-sm rounded-lg px-4 py-3 border border-green-200 bg-green-50 text-green-700';
            feedback.innerHTML = `<strong>Pronto!</strong> O chamado foi enviado e será avaliado pelo Gerente de Manutenção imediatamente.`;
            feedback.classList.remove('hidden');
            
            document.getElementById('reportForm').reset();
            toggleRoomInput();
            
            setTimeout(() => {
                feedback.classList.add('hidden');
            }, 5000);
        });
    </script>
</body>
</html>
