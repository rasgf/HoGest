<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Reportar Problema | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 900: '#0f172a', 800: '#1e293b' }, teal: { 600: '#0d9488' } } } } }
    </script>
    <script>
        function toggleTheme() {
            const doc = document.documentElement;
            if (doc.classList.contains('dark')) { doc.classList.remove('dark'); localStorage.theme = 'light'; } 
            else { doc.classList.add('dark'); localStorage.theme = 'dark'; }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
    <style>
        /* Safe area for notched phones */
        .safe-top { padding-top: env(safe-area-inset-top, 0px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
        /* Larger touch targets on mobile */
        @media (max-width: 767px) {
            select, input, textarea, button[type="submit"] { min-height: 48px; font-size: 16px !important; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans antialiased min-h-screen flex transition-colors duration-200">
    
    <!-- Desktop sidebar (hidden on mobile) -->
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex-col hidden md:flex transition-colors duration-200">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-slate-700 cursor-pointer" onclick="window.location.href='dashboard.html'">
            <img src="assets/insolito-logo.png" alt="Insolito" class="h-9">
        </div>
        <nav id="sidebarNav" class="flex-1 py-6 px-4 space-y-2">
            <!-- Renderizado via JS -->
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-slate-700">
            <div class="flex items-center gap-3 px-4 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition" onclick="MockDB.logout()">
                <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                    <span id="userInitials" class="text-xs font-bold text-slate-600 dark:text-slate-300"></span>
                </div>
                <div>
                    <p id="userNameLabel" class="text-sm font-medium text-slate-800 dark:text-slate-200"></p>
                    <p id="userRoleLabel" class="text-xs text-slate-500 dark:text-slate-400 capitalize"></p>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 ml-auto text-slate-400"></i>
            </div>
        </div>
    </aside>

    <!-- Mobile slide-over sidebar -->
    <div id="mobileSidebarOverlay" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden" onclick="closeMobileSidebar()"></div>
    <aside id="mobileSidebar" class="fixed top-0 left-0 w-72 h-full bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col z-50 -translate-x-full transition-transform duration-300 ease-out md:hidden">
        <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200 dark:border-slate-700">
            <img src="assets/insolito-logo.png" alt="HotGest" class="h-9">
            <button onclick="closeMobileSidebar()" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2" id="mobileSidebarNav"></nav>
        <div class="p-4 border-t border-gray-200 dark:border-slate-700">
            <div class="flex items-center justify-between px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer" onclick="MockDB.logout()">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                        <span class="text-xs font-bold text-slate-600 dark:text-slate-300" id="mobileUserInitials">XX</span>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-800 dark:text-slate-200" id="mobileUserNameLabel">Nome</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="mobileUserRoleLabel">Role</p>
                    </div>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Desktop header -->
        <header class="h-16 border-b border-gray-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/50 backdrop-blur hidden md:flex justify-between items-center px-8 transition-colors duration-200">
            <h1 class="text-xl font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2"><i data-lucide="bell-ring" class="w-5 h-5 text-teal-600"></i> Reportar Problema</h1>
            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400"><i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i></button>
        </header>

        <!-- Mobile header (visible only < md) -->
        <header class="safe-top border-b border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex md:hidden justify-between items-center px-4 py-3">
            <div class="flex items-center gap-2">
                <button onclick="openMobileSidebar()" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg"><i data-lucide="menu" class="w-5 h-5 text-slate-500"></i></button>
                <img src="assets/insolito-logo.png" alt="HotGest" class="h-8">
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-700 text-slate-500">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
                <button onclick="MockDB.logout()" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 transition">
                    <span id="mobileUserName" class="text-xs font-medium text-slate-600 dark:text-slate-300 max-w-[80px] truncate"></span>
                    <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 flex items-start md:items-center justify-center safe-bottom">
            <div class="w-full max-w-lg bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 p-5 md:p-8 shadow-sm">
                <div class="flex items-center gap-3 mb-1">
                    <div class="w-10 h-10 rounded-full bg-teal-100 dark:bg-teal-900/30 flex items-center justify-center shrink-0">
                        <i data-lucide="bell-ring" class="w-5 h-5 text-teal-600 dark:text-teal-400"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg text-slate-900 dark:text-white">Nova Solicitação de O.S</h2>
                        <p class="text-xs text-slate-500">A manutenção será notificada imediatamente.</p>
                    </div>
                </div>
                <p class="text-sm text-slate-500 mb-5 mt-3">Preencha os dados básicos. A equipe de manutenção fará a curadoria e classificação da prioridade logo em seguida.</p>
                
                <form id="reportForm" class="space-y-4">
                    <div>
                        <label for="locationType" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Área do Problema</label>
                        <select id="locationType" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-xl p-3 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 text-slate-800 dark:text-slate-200 transition" onchange="toggleRoomInput()">
                            <option value="">Selecione uma área...</option>
                            <option value="Recepção">Recepção / Lobby</option>
                            <option value="Piscina">Piscina / Área Externa</option>
                            <option value="Restaurante">Restaurante / Cozinha</option>
                            <option value="Quarto">Quarto de Hóspede</option>
                            <option value="Corredor">Corredores / Áreas Comuns</option>
                            <option value="Jardim">Jardim / Área Lazer</option>
                            <option value="Academia">Academia / Spa</option>
                            <option value="Estacionamento">Estacionamento</option>
                            <option value="Outro">Outro (Especificar)</option>
                        </select>
                    </div>

                    <div id="roomInputContainer" class="hidden">
                        <label for="roomNumber" class="block text-xs font-bold text-teal-600 dark:text-teal-500 uppercase tracking-wide mb-2">Número do Quarto / Localização Específica</label>
                        <input id="roomNumber" type="text" placeholder="Ex: 104, Master Suite 05, Corredor Ala Leste" class="w-full bg-teal-50 dark:bg-teal-900/20 border border-teal-200 dark:border-teal-700 rounded-xl p-3 text-slate-800 dark:text-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 outline-none transition">
                    </div>

                    <div>
                        <label for="titleInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">O que aconteceu?</label>
                        <input id="titleInput" type="text" placeholder="Um breve resumo do problema" required class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-xl p-3 text-slate-800 dark:text-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 outline-none transition">
                    </div>

                    <div>
                        <label for="descInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Detalhes (Opcional)</label>
                        <textarea id="descInput" rows="3" placeholder="Informações extras do hóspede, vazamento intenso, barulho..." class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-xl p-3 text-slate-800 dark:text-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 outline-none resize-none transition"></textarea>
                    </div>

                    <p id="formFeedback" class="hidden text-sm rounded-xl px-4 py-3 border"></p>

                    <button type="submit" class="w-full mt-2 bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all flex justify-center items-center gap-2 text-base">
                        <i data-lucide="send" class="w-5 h-5"></i> Enviar para Manutenção
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const user = MockDB.requireLogin();
        if (user) {
            document.getElementById('sidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'reception_report.html');
            MockDB.populateUserProfile(user);
            populateMobileSidebar(user);
            
            // Mobile user name
            const firstName = user.name.split(' ')[0].split('-')[0].trim();
            document.getElementById('mobileUserName').textContent = firstName;

            lucide.createIcons();

            const selectEl = document.getElementById('locationType');

            if (user.role === 'recepcao') {
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="Recepção">Recepção / Lobby</option>
                    <option value="Quarto">Quarto de Hóspede</option>
                `;
            } else if (user.role === 'camareira') {
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="Quarto">Quarto de Hóspede</option>
                    <option value="Corredor">Corredores / Áreas Comuns</option>
                    <option value="Piscina">Piscina / Área Externa</option>
                    <option value="Restaurante">Restaurante / Refeitório</option>
                    <option value="Jardim">Jardim / Área de Lazer</option>
                    <option value="Academia">Academia / Spa</option>
                    <option value="Estacionamento">Estacionamento</option>
                `;
            } else if (user.role === 'trabalhador' && user.speciality) {
                selectEl.innerHTML = `
                    <option value="">Selecione uma área...</option>
                    <option value="${user.speciality}">${user.speciality}</option>
                    <option value="Quarto">Quarto de Hóspede (${user.speciality})</option>
                `;
            }
        }

        function toggleRoomInput() {
            const locType = document.getElementById('locationType').value;
            const roomContainer = document.getElementById('roomInputContainer');
            const label = document.getElementById('roomNumber').previousElementSibling;
            
            const needsDetail = locType === 'Quarto' || locType === 'Corredor' || locType === 'Outro';
            const isCamareira = user && user.role === 'camareira';
            
            if (needsDetail || (isCamareira && locType !== '')) {
                roomContainer.classList.remove('hidden');
                if (locType === 'Quarto') {
                    label.textContent = 'Número do Quarto / Localização Específica';
                    document.getElementById('roomNumber').placeholder = 'Ex: 104, Master Suite 05';
                } else {
                    label.textContent = 'Localização Específica (Opcional)';
                    document.getElementById('roomNumber').placeholder = 'Ex: Piscina leste, Corredor Ala B, Jardim Bloco 2';
                }
                if (locType === 'Quarto') document.getElementById('roomNumber').focus();
            } else {
                roomContainer.classList.add('hidden');
            }
        }

        document.getElementById('reportForm').addEventListener('submit', event => {
            event.preventDefault();
            
            const locType = document.getElementById('locationType').value;
            let finalLocation = locType;
            if (locType === 'Quarto') {
                finalLocation = 'Quarto ' + document.getElementById('roomNumber').value;
            } else if (!locType) {
                alert("Por favor, selecione a área.");
                return;
            }

            MockDB.createTicket({
                title: document.getElementById('titleInput').value.trim(),
                location: finalLocation,
                priority: 'normal',
                category: 'Manutencao',
                description: document.getElementById('descInput').value.trim()
            });

            const feedback = document.getElementById('formFeedback');
            feedback.className = 'mt-4 text-sm rounded-xl px-4 py-3 border border-green-200 bg-green-50 dark:bg-green-900/20 dark:border-green-800 text-green-700 dark:text-green-400';
            feedback.innerHTML = `<strong>Pronto!</strong> O chamado foi enviado e será avaliado pelo Gerente de Manutenção imediatamente.`;
            feedback.classList.remove('hidden');
            
            document.getElementById('reportForm').reset();
            toggleRoomInput();
            
            setTimeout(() => {
                feedback.classList.add('hidden');
            }, 5000);
        });
    
        // --- Mobile Sidebar ---
        function openMobileSidebar() {
            document.getElementById('mobileSidebarOverlay').classList.remove('hidden');
            requestAnimationFrame(() => {
                document.getElementById('mobileSidebar').classList.remove('-translate-x-full');
            });
        }
        function closeMobileSidebar() {
            document.getElementById('mobileSidebar').classList.add('-translate-x-full');
            setTimeout(() => document.getElementById('mobileSidebarOverlay').classList.add('hidden'), 300);
        }

        function populateMobileSidebar(user) {
            document.getElementById('mobileSidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'reception_report.html');
            document.getElementById('mobileUserInitials').textContent = user.name.substring(0,2).toUpperCase();
            document.getElementById('mobileUserNameLabel').textContent = user.name;
            document.getElementById('mobileUserRoleLabel').textContent = user.role.toUpperCase().replace('_', ' ');

            // Intercept notification links (mock navigation for prototype)
            document.querySelectorAll('#sidebarNav a, #mobileSidebarNav a').forEach(link => {
                if (link.href.includes('messages.html')) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = "dashboard.html?openNotif=true";
                    });
                }
            });
        }

</script>
</body>
</html>
