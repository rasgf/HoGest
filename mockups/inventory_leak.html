<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario / Sangria | Insolito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 900: '#0f172a', 800: '#1e293b' }, teal: { 600: '#0d9488' }, orange: { 500: '#f97316' } } } } }
    </script>
    <script>
        const user = MockDB.requireLogin(['admin_geral', 'controlador']);
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen flex">
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-slate-700 cursor-pointer" onclick="window.location.href='dashboard.html'">
            <img src="assets/insolito-logo.svg" alt="Insolito" class="h-9">
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2" id="sidebarNav"></nav>
        <div class="p-4 border-t border-gray-200 dark:border-slate-700">
            <div class="flex items-center justify-between px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer" onclick="MockDB.logout()">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                        <span class="text-xs font-bold text-slate-600 dark:text-slate-300" id="userInitials">XX</span>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-800 dark:text-slate-200" id="userNameLabel">Nome</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="userRoleLabel">Role</p>
                    </div>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 border-b border-gray-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/50 backdrop-blur flex justify-between items-center px-8 text-sm md:text-base">
            <h1 class="font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2"><i data-lucide="package" class="w-5 h-5"></i> Gestão de Almoxarifado</h1>
            <div class="flex gap-4 items-center">
                 <button onclick="mockExport('pdf')" class="text-xs bg-slate-200 dark:bg-slate-700 px-3 py-1.5 rounded hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i> Exportar Inventário (PDF)</button>
                 <button onclick="toggleTheme()" class="p-2 border rounded border-gray-200 dark:border-slate-600 hidden md:block"><i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i><i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8">
            
            <div id="actionAlert" class="hidden p-3 bg-teal-100 border border-teal-200 text-teal-800 rounded dark:bg-teal-900/30 dark:border-teal-800 dark:text-teal-400 text-sm flex items-center justify-between">
                <span id="actionAlertMsg">Baixa manual registrada com sucesso!</span>
                <button onclick="document.getElementById('actionAlert').classList.add('hidden')"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <!-- Dashboard de Inventário Local -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Lista de SKUs (Itens em Estoque) -->
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm flex flex-col overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-900/50">
                        <h3 class="font-semibold">Saldo de Materiais</h3>
                        <div class="flex gap-2">
                            <button onclick="openImportModal()" class="text-xs bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 px-2 py-1 rounded">Importar CSV</button>
                            <button onclick="openNewMaterialModal()" class="text-xs bg-teal-600 hover:bg-teal-700 text-white px-2 py-1 rounded">+ Novo Material</button>
                        </div>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 dark:bg-slate-700/50 text-slate-500 text-xs uppercase">
                            <tr><th class="px-4 py-2">Item</th><th class="px-4 py-2 text-right">Estoque</th><th class="px-4 py-2 text-right">Ação</th></tr>
                        </thead>
                        <tbody id="inventoryList" class="divide-y divide-gray-100 dark:divide-slate-700/50">
                             <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Painel de Baixas Pendentes (Fuga de SLA de Material) -->
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-orange-200 dark:border-orange-500/30 shadow-sm flex flex-col overflow-hidden">
                    <div class="px-6 py-4 border-b border-orange-100 dark:border-orange-500/20 flex justify-between items-center bg-orange-50 dark:bg-orange-500/10">
                        <h3 class="font-semibold text-orange-600 dark:text-orange-400 flex items-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Pendências de Baixa (O.S Fechadas)</h3>
                    </div>
                    <div id="pendingInventoryList" class="p-4 space-y-4"></div>
                </div>

            </div>
        </div>
    </main>

    <div id="newMaterialModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl w-[460px] shadow-2xl border border-slate-200 dark:border-slate-700">
            <h3 class="font-bold text-lg mb-4">Novo Material</h3>
            <div class="grid grid-cols-2 gap-4">
                <input id="materialName" placeholder="Nome do item" class="col-span-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialStock" placeholder="Estoque atual" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialUnit" placeholder="Unidade" value="un" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialMinStock" placeholder="Estoque minimo" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialCost" placeholder="Custo unitario" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialArea" placeholder="Area" value="Geral" class="col-span-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
            </div>
            <div class="flex gap-3 justify-end mt-5">
                <button onclick="closeNewMaterialModal()" class="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded text-sm">Cancelar</button>
                <button onclick="saveNewMaterial()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded text-sm">Salvar item</button>
            </div>
        </div>
    </div>

    <div id="importModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl w-[540px] shadow-2xl border border-slate-200 dark:border-slate-700">
            <h3 class="font-bold text-lg mb-2">Importar Estoque via CSV</h3>
            <p class="text-xs text-slate-500 mb-4">Formato esperado: <code>name,stock,unit,minStock,unitCost,area</code></p>
            <textarea id="csvInput" rows="10" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">name,stock,unit,minStock,unitCost,area
Pilha AAA,80,un,20,3.5,Eletrica
Detergente Industrial,40,lt,12,22,Geral</textarea>
            <div class="flex gap-3 justify-end mt-5">
                <button onclick="closeImportModal()" class="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded text-sm">Cancelar</button>
                <button onclick="importCSV()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded text-sm">Importar</button>
            </div>
        </div>
    </div>

    <script>
        if (user) {
            MockDB.populateUserProfile(user);

            // Build Nav
            document.getElementById('sidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'inventory_leak.html');

            renderInventory();
            renderPendingApprovals();
        }

        function renderInventory() {
            const currentDb = MockDB.get();
            const list = document.getElementById('inventoryList');
            let html = '';
            currentDb.inventory.forEach(item => {
                const critical = item.stock <= item.minStock;
                html += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/30 transition">
                        <td class="px-4 py-3 font-medium">${item.name} <div class="text-[10px] text-slate-400">Min: ${item.minStock} ${item.unit}</div></td>
                        <td class="px-4 py-3 text-right">
                             <span class="${critical ? 'text-red-600 dark:text-rose-400 font-bold bg-red-100 dark:bg-red-500/20 px-2 py-0.5 rounded' : 'text-slate-800 dark:text-slate-200 font-mono'} text-sm">${item.stock}</span>
                             <span class="text-[10px] text-slate-500">${item.unit}</span>
                        </td>
                        <td class="px-4 py-3 text-right">
                             <button class="text-teal-600 hover:text-teal-700"><i data-lucide="edit-3" class="w-4 h-4 ml-auto"></i></button>
                        </td>
                    </tr>
                `;
            });
            list.innerHTML = html;
            lucide.createIcons();
        }

        function renderPendingApprovals() {
            const container = document.getElementById('pendingInventoryList');
            const currentDb = MockDB.get();
            const cards = currentDb.tickets
                .filter(ticket => ticket.status === 'awaiting_inventory')
                .map(ticket => {
                    const materials = ticket.materialsUsed.map(material => {
                        const item = currentDb.inventory.find(entry => entry.id === material.inventoryId);
                        return `<span class="text-xs font-bold px-2 py-1 bg-gray-200 dark:bg-slate-700 rounded">-${material.quantity}x ${item ? item.name : 'Item'}</span>`;
                    }).join('');

                    return `
                        <div class="p-4 border border-orange-200 dark:border-orange-500/30 rounded-lg bg-orange-50/50 dark:bg-slate-800">
                            <div class="flex justify-between items-start mb-2">
                                <div><span class="text-xs font-bold font-mono bg-orange-100 dark:bg-slate-700 text-orange-600 px-1 py-0.5 rounded">#OS-${ticket.id}</span> <span class="text-sm font-semibold ml-1">${ticket.title}</span></div>
                                <span class="text-xs text-slate-500">Aguardando auditoria</span>
                            </div>
                            <p class="text-xs text-slate-500 mb-3">${ticket.location}. O operador reportou consumo via app e a baixa precisa ser conciliada.</p>
                            <div class="flex items-center gap-2 flex-wrap">
                                ${materials}
                                <button onclick="approveTicketInventory(${ticket.id})" class="text-xs bg-orange-500 hover:bg-orange-600 text-white px-3 py-1.5 rounded ml-auto flex items-center gap-1"><i data-lucide="check-square" class="w-3 h-3"></i> Realizar Baixa</button>
                            </div>
                        </div>
                    `;
                }).join('');

            container.innerHTML = cards || `<div class="text-sm text-slate-500">Nenhuma pendencia de baixa neste momento.</div>`;
            lucide.createIcons();
        }

        function approveTicketInventory(ticketId) {
            const approved = MockDB.approveInventoryForTicket(ticketId);
            if (!approved) {
                return;
            }

            renderInventory();
            renderPendingApprovals();
            const alert = document.getElementById('actionAlert');
            document.getElementById('actionAlertMsg').innerText = `Baixa da O.S #${ticketId} registrada com sucesso!`;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 4000);
        }

        function openNewMaterialModal() {
            document.getElementById('newMaterialModal').classList.remove('hidden');
        }

        function closeNewMaterialModal() {
            document.getElementById('newMaterialModal').classList.add('hidden');
        }

        function saveNewMaterial() {
            const name = document.getElementById('materialName').value.trim();
            if (!name) {
                return;
            }

            const item = MockDB.addInventoryItem({
                name,
                stock: document.getElementById('materialStock').value,
                unit: document.getElementById('materialUnit').value.trim(),
                minStock: document.getElementById('materialMinStock').value,
                unitCost: document.getElementById('materialCost').value,
                area: document.getElementById('materialArea').value.trim()
            });
            closeNewMaterialModal();
            renderInventory();
            const alert = document.getElementById('actionAlert');
            document.getElementById('actionAlertMsg').innerText = `${item.name} adicionado ao estoque com sucesso!`;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 4000);
        }

        function openImportModal() {
            document.getElementById('importModal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
        }

        function importCSV() {
            const result = MockDB.importInventoryCSV(document.getElementById('csvInput').value);
            closeImportModal();
            renderInventory();
            const alert = document.getElementById('actionAlert');
            document.getElementById('actionAlertMsg').innerText = `${result.imported} itens importados para o estoque.`;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 4000);
        }

        lucide.createIcons();
    </script>
</body>
</html>
