<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria de Estoque | HotGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#f0fdfa',
                        100: '#ccfbf1',
                        200: '#99f6e4',
                        300: '#5eead4',
                        400: '#2dd4bf',
                        500: '#14b8a6',
                        600: '#0d9488',
                        700: '#0f766e',
                        800: '#115e59',
                        900: '#134e4a',
                        950: '#042f2e',
                    },
                    accent: {
                        50: '#fdf8f6',
                        100: '#f2e8e5',
                        200: '#eaddd7',
                        300: '#e0cec7',
                        400: '#d2bab0',
                        500: '#a37c6b',
                        600: '#865f4d',
                        700: '#694230',
                        800: '#4c2513',
                        900: '#2f0800',
                    },
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.12), inset 0 1px 2px 0 rgba(255, 255, 255, 0.8)',
                    'dark-glass': '0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 1px 2px 0 rgba(255, 255, 255, 0.15)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl text-slate-800 dark:text-slate-200 font-sans min-h-screen flex">
    
    <!-- Mesh Gradient Mesh (Enterprise) -->
    <div class="fixed top-[-20%] left-[-10%] w-[70vw] h-[70vh] rounded-full bg-primary-200/40 dark:bg-primary-900/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed top-[20%] right-[-10%] w-[40vw] h-[50vh] rounded-full bg-accent-200/50 dark:bg-accent-900/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[60%] rounded-full bg-gradient-to-tl from-rose-300/30 via-yellow-200/20 to-transparent dark:from-amber-900/40 dark:via-orange-900/20 blur-[120px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent-300/40 dark:bg-accent-800/20 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    
    <!-- Desktop sidebar -->
    <aside class="w-64 relative z-10 bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass border-r border-white/60 dark:border-slate-700/80 flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-white/60 dark:border-slate-700/80 cursor-pointer" onclick="window.location.href='dashboard.html'">
            <img src="assets/insolito-logo.png" alt="HotGest" class="h-9">
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2" id="sidebarNav"></nav>
        <div class="p-4 border-t border-white/60 dark:border-slate-700/80">
            <div class="flex items-center justify-between px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer" onclick="MockDB.logout()">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                        <span class="text-xs font-bold text-slate-600 dark:text-slate-300" id="userInitials">XX</span>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-800 dark:text-slate-200" id="userNameLabel">Nome</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="userRoleLabel">Role</p>
                    </div>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
            </div>
        </div>
    </aside>

    <!-- Mobile slide-over sidebar -->
    <div id="mobileSidebarOverlay" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm backdrop-saturate-150 z-40 md:hidden" onclick="closeMobileSidebar()"></div>
    <aside id="mobileSidebar" class="fixed top-0 left-0 w-72 h-full bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass border-r border-white/60 dark:border-slate-700/80 flex flex-col z-50 -translate-x-full transition-transform duration-300 ease-out md:hidden">
        <div class="h-16 flex items-center justify-between px-6 border-b border-white/60 dark:border-slate-700/80">
            <img src="assets/insolito-logo.png" alt="HotGest" class="h-9">
            <button onclick="closeMobileSidebar()" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-full"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2" id="mobileSidebarNav"></nav>
        <div class="p-4 border-t border-white/60 dark:border-slate-700/80">
            <div class="flex items-center justify-between px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer" onclick="MockDB.logout()">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-slate-700 flex items-center justify-center border border-gray-300 dark:border-slate-600">
                        <span class="text-xs font-bold text-slate-600 dark:text-slate-300" id="mobileUserInitials">XX</span>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-800 dark:text-slate-200" id="mobileUserNameLabel">Nome</p>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="mobileUserRoleLabel">Role</p>
                    </div>
                </div>
                <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
            </div>
        </div>
    </aside>

    <main class="flex-1 relative z-10 flex flex-col h-screen overflow-hidden">
        <header class="h-16 border-b border-white/60 dark:border-slate-700/80 bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass flex justify-between items-center px-4 md:px-8">
            <div class="flex items-center gap-3">
                <button onclick="openMobileSidebar()" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg md:hidden"><i data-lucide="menu" class="w-5 h-5 text-slate-500"></i></button>
                <h1 class="text-lg md:text-xl font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="package-search" class="w-5 h-5 hidden md:block"></i>
                    Auditoria de Almoxarifado
                </h1>
            </div>
            <button onclick="toggleTheme()" class="p-2 border rounded border-slate-200/60 dark:border-slate-600 hidden md:block">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8">
            <div id="actionAlert" class="hidden p-3 bg-primary-100 border border-primary-200 text-primary-800 rounded dark:bg-primary-900/30 dark:border-primary-800 dark:text-primary-400 text-sm flex items-center justify-between">
                <span id="actionAlertMsg">Baixa registrada com sucesso.</span>
                <button onclick="document.getElementById('actionAlert').classList.add('hidden')">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass border-t border-l border-white/60 dark:border-slate-700/80 rounded-2xl p-5 shadow-[0_2px_20px_rgb(0,0,0,0.04)]">
                    <p class="text-xs uppercase tracking-[0.2em] text-slate-500 mb-2">Itens cadastrados</p>
                    <p id="inventoryCount" class="text-3xl font-bold text-slate-900 dark:text-white">0</p>
                </div>
                <div class="bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass border border-amber-200 dark:border-amber-500/20 rounded-2xl p-5 shadow-[0_2px_20px_rgb(0,0,0,0.04)]">
                    <p class="text-xs uppercase tracking-[0.2em] text-slate-500 mb-2">Baixas pendentes</p>
                    <p id="pendingCount" class="text-3xl font-bold text-amber-600 dark:text-amber-400">0</p>
                </div>
                <div class="bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass border-t border-l border-white/60 dark:border-slate-700/80 rounded-2xl p-5 shadow-[0_2px_20px_rgb(0,0,0,0.04)]">
                    <p class="text-xs uppercase tracking-[0.2em] text-slate-500 mb-2">Itens críticos</p>
                    <p id="criticalCount" class="text-3xl font-bold text-rose-600 dark:text-rose-400">0</p>
                </div>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <section class="bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass rounded-2xl border-t border-l border-white/60 dark:border-slate-700/80 shadow-[0_2px_20px_rgb(0,0,0,0.04)] overflow-hidden">
                    <div class="px-6 py-4 border-b border-white/60 dark:border-slate-700/80 flex justify-between items-center bg-slate-50 dark:bg-slate-900 backdrop-blur-xl/50">
                        <h3 class="font-semibold">Saldo de Materiais</h3>
                        <button onclick="openNewMaterialModal()" class="text-xs bg-primary-600 hover:bg-primary-700 text-white px-3 py-2 rounded-lg">+ Novo Material</button>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 dark:bg-slate-700/50 text-slate-500 text-xs uppercase">
                            <tr>
                                <th class="px-4 py-2">Item</th>
                                <th class="px-4 py-2 text-right">Estoque</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryList" class="divide-y divide-gray-100 dark:divide-slate-700/50"></tbody>
                    </table>
                </section>

                <section class="bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass rounded-2xl border border-amber-200 dark:border-amber-500/20 shadow-[0_2px_20px_rgb(0,0,0,0.04)] overflow-hidden">
                    <div class="px-6 py-4 border-b border-amber-100 dark:border-amber-500/20 bg-amber-50 dark:bg-amber-500/10">
                        <h3 class="font-semibold text-amber-700 dark:text-amber-300 flex items-center gap-2">
                            <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                            Pendências de Baixa
                        </h3>
                    </div>
                    <div id="pendingInventoryList" class="p-4 space-y-4"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="newMaterialModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm backdrop-saturate-150 flex items-center justify-center z-50">
        <div class="bg-white/30 dark:bg-slate-900/40 backdrop-blur-[40px] backdrop-saturate-[200%] border border-white/40 border-t-white/90 border-l-white/90 dark:border-white/10 dark:border-t-white/30 shadow-glass dark:shadow-dark-glass p-6 rounded-2xl w-[460px] shadow-2xl border border-slate-200 dark:border-slate-700">
            <h3 class="font-bold text-lg mb-4">Novo Material</h3>
            <div class="grid grid-cols-2 gap-4">
                <input id="materialName" placeholder="Nome do item" class="col-span-2 bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialStock" placeholder="Estoque atual" class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialUnit" placeholder="Unidade" value="un" class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialMinStock" placeholder="Estoque minimo" class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialCost" placeholder="Custo unitario" class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
                <input id="materialArea" placeholder="Area" value="Geral" class="col-span-2 bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-slate-300 dark:border-slate-600 rounded p-3 text-sm">
            </div>
            <div class="flex gap-3 justify-end mt-5">
                <button onclick="closeNewMaterialModal()" class="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded text-sm">Cancelar</button>
                <button onclick="saveNewMaterial()" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded text-sm">Salvar item</button>
            </div>
        </div>
    </div>

    <script>
        const user = MockDB.requireLogin();
        if (user) {
            MockDB.populateUserProfile(user);
            document.getElementById('sidebarNav').innerHTML = MockDB.buildDesktopNav(user, 'inventory_leak.html');

            // Populate mobile sidebar
            var mNav = document.getElementById('mobileSidebarNav');
            if(mNav) mNav.innerHTML = document.getElementById('sidebarNav').innerHTML;
            var mInit = document.getElementById('mobileUserInitials');
            if(mInit) mInit.textContent = user.name.substring(0,2).toUpperCase();
            var mLabel = document.getElementById('mobileUserNameLabel');
            if(mLabel) mLabel.textContent = user.name;
            var mRole = document.getElementById('mobileUserRoleLabel');
            if(mRole) mRole.textContent = user.role.toUpperCase().replace('_', ' ');

            // Intercept notification links (mock navigation for prototype)
            document.querySelectorAll('#sidebarNav a, #mobileSidebarNav a').forEach(link => {
                if (link.href.includes('messages.html')) {
                    link.addEventListener('click', function(e) {
                        if(typeof openNotifPanel === "function") {
                           e.preventDefault();
                           closeMobileSidebar();
                           setTimeout(() => openNotifPanel(), 100);
                        } else {
                           e.preventDefault();
                           window.location.href = "dashboard.html?openNotif=true";
                        }
                    });
                }
            });

            renderInventory();
            renderPendingApprovals();
        }

        function renderInventory() {
            const currentDb = MockDB.get();
            const list = document.getElementById('inventoryList');
            const criticalItems = currentDb.inventory.filter(item => item.stock <= item.minStock);

            document.getElementById('inventoryCount').textContent = currentDb.inventory.length;
            document.getElementById('criticalCount').textContent = criticalItems.length;

            list.innerHTML = currentDb.inventory.map(item => {
                const critical = item.stock <= item.minStock;
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                        <td class="px-4 py-3 font-medium">
                            ${item.name}
                            <div class="text-[10px] text-slate-400">${item.area} · Min: ${item.minStock} ${item.unit}</div>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <span class="${critical ? 'text-rose-600 dark:text-rose-400 font-bold bg-rose-100 dark:bg-rose-500/20 px-2 py-0.5 rounded' : 'text-slate-800 dark:text-slate-200 font-mono'} text-sm">
                                ${item.stock}
                            </span>
                            <span class="text-[10px] text-slate-500">${item.unit}</span>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderPendingApprovals() {
            const currentDb = MockDB.get();
            const tickets = MockDB.getPendingInventoryTickets();
            const container = document.getElementById('pendingInventoryList');

            document.getElementById('pendingCount').textContent = tickets.length;

            container.innerHTML = tickets.map(ticket => {
                const materials = (ticket.materialsUsed || []).map(material => {
                    const item = currentDb.inventory.find(entry => entry.id === material.inventoryId);
                    return `<span class="text-xs font-bold px-2 py-1 bg-gray-200 dark:bg-slate-700 rounded-full">-${material.quantity}x ${item ? item.name : 'Item'}</span>`;
                }).join('');

                return `
                    <div class="p-4 border border-amber-200 dark:border-amber-500/30 rounded-2xl bg-amber-50/60 dark:bg-slate-900/50">
                        <div class="flex justify-between items-start gap-3 mb-3">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs font-bold font-mono bg-amber-100 dark:bg-slate-700 text-amber-700 dark:text-amber-300 px-2 py-1 rounded-full">#OS-${ticket.id}</span>
                                    <span class="text-sm font-semibold">${ticket.title}</span>
                                    ${ticket.refacaoNumero ? `<span class="text-[11px] font-semibold px-2 py-1 rounded-full bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300">Refação #${ticket.refacaoNumero}</span>` : ''}
                                </div>
                                <p class="text-xs text-slate-500 mt-2">${ticket.location} · Execução concluída, aguardando apenas auditoria do estoque.</p>
                            </div>
                            <button onclick="approveTicketInventory(${ticket.id})" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg flex items-center gap-1 whitespace-nowrap">
                                <i data-lucide="check-square" class="w-3 h-3"></i>
                                Realizar baixa
                            </button>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">${materials}</div>
                    </div>
                `;
            }).join('') || '<div class="text-sm text-slate-500">Nenhuma pendência de baixa neste momento.</div>';

            lucide.createIcons();
        }

        function approveTicketInventory(ticketId) {
            const approved = MockDB.approveInventoryForTicket(ticketId);
            if (!approved) return;

            renderInventory();
            renderPendingApprovals();
            const alert = document.getElementById('actionAlert');
            document.getElementById('actionAlertMsg').innerText = `Baixa da O.S. #${ticketId} registrada com sucesso.`;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 4000);
        }

        function openNewMaterialModal() {
            document.getElementById('newMaterialModal').classList.remove('hidden');
        }

        function closeNewMaterialModal() {
            document.getElementById('newMaterialModal').classList.add('hidden');
        }

        function saveNewMaterial() {
            const name = document.getElementById('materialName').value.trim();
            if (!name) return;

            const item = MockDB.addInventoryItem({
                name,
                stock: document.getElementById('materialStock').value,
                unit: document.getElementById('materialUnit').value.trim(),
                minStock: document.getElementById('materialMinStock').value,
                unitCost: document.getElementById('materialCost').value,
                area: document.getElementById('materialArea').value.trim()
            });

            closeNewMaterialModal();
            renderInventory();
            const alert = document.getElementById('actionAlert');
            document.getElementById('actionAlertMsg').innerText = `${item.name} adicionado ao estoque com sucesso.`;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 4000);
        }

        lucide.createIcons();
    
        // --- Mobile Sidebar ---
        function openMobileSidebar() {
            var el = document.getElementById('mobileSidebarOverlay');
            if(el) el.classList.remove('hidden');
            requestAnimationFrame(() => {
                var s = document.getElementById('mobileSidebar');
                if(s) s.classList.remove('-translate-x-full');
            });
        }
        function closeMobileSidebar() {
            var s = document.getElementById('mobileSidebar');
            if(s) s.classList.add('-translate-x-full');
            setTimeout(() => {
                var el = document.getElementById('mobileSidebarOverlay');
                if(el) el.classList.add('hidden');
            }, 300);
        }

</script>
</body>
</html>
