<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>HotGest | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50:  '#f0f7f4',
                        100: '#d9ede2',
                        200: '#b5dbc6',
                        300: '#84c1a3',
                        400: '#55a47e',
                        500: '#358764',
                        600: '#266c50',
                        700: '#1f5741',
                        800: '#1b4535',
                        900: '#17392c',
                        950: '#0c2019',
                    },
                    accent: {
                        50:  '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.04)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-200/60 dark:border-slate-700 overflow-hidden">
        <div class="p-8 pb-6 border-b border-gray-100 dark:border-slate-700 text-center">
            <img src="assets/insolito-logo.png" alt="Insolito" class="h-12 mx-auto mb-2">
            <p class="text-slate-500 dark:text-slate-400 text-sm">Sistema Integrado de Estancamento Operacional</p>
        </div>
        
        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Usuário de Acesso</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400 text-slate-400"></i>
                        </div>
                        <input type="text" id="username" class="bg-slate-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-3" placeholder="Ex: admin, controlador, executor_avac..." required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-slate-400 text-slate-400"></i>
                        </div>
                        <input type="password" id="password" class="bg-slate-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-3" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="text-red-500 text-xs hidden font-medium text-center" id="errorMsg">
                    Usuário ou senha incorretos.
                </div>

                <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-3.5 text-center shadow-lg shadow-primary-500/30 transition-all active:scale-95">
                    Acessar Sistema
                </button>
            </form>

            <div class="mt-8 bg-slate-100 dark:bg-slate-900 p-4 rounded-lg border border-slate-200 dark:border-slate-700">
                <h4 class="text-xs font-bold text-slate-500 uppercase mb-3 text-center">Credenciais para Apresentação</h4>
                <p class="text-[10px] text-slate-400 text-center mb-3">Gestão</p>
                <div class="grid grid-cols-3 gap-2 text-xs mb-3">
                    <button type="button" onclick="fillAndSubmit('admin', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-primary-50 text-left border border-transparent hover:border-primary-200 dark:hover:border-slate-600"><strong>Admin Geral</strong><br>admin / 123</button>
                    <button type="button" onclick="fillAndSubmit('manutencao', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-primary-50 text-left border border-transparent hover:border-primary-200 dark:hover:border-slate-600"><strong>Manutenção</strong><br>manutencao / 123</button>
                    <button type="button" onclick="fillAndSubmit('controlador', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-orange-50 text-left border border-transparent hover:border-orange-200 dark:hover:border-slate-600"><strong>Controlador</strong><br>controlador / 123</button>
                </div>
                <p class="text-[10px] text-slate-400 text-center mb-3">Operação (Mobile)</p>
                <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                    <button type="button" onclick="fillAndSubmit('executor_eletrica', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-blue-50 text-left border border-transparent hover:border-blue-200 dark:hover:border-slate-600"><strong>Executor Elétrica</strong><br>executor_eletrica / 123</button>
                    <button type="button" onclick="fillAndSubmit('executor_hidraulica', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-blue-50 text-left border border-transparent hover:border-blue-200 dark:hover:border-slate-600"><strong>Executor Hidráulica</strong><br>executor_hidraulica / 123</button>
                </div>
                <p class="text-[10px] text-slate-400 text-center mb-3">Reportar Problemas</p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillAndSubmit('recepcao', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-emerald-50 text-left border border-transparent hover:border-emerald-200 dark:hover:border-slate-600"><strong>Recepção</strong><br>recepcao / 123</button>
                    <button type="button" onclick="fillAndSubmit('camareira', '123')" class="bg-white dark:bg-slate-800 p-2 rounded hover:bg-purple-50 text-left border border-transparent hover:border-purple-200 dark:hover:border-slate-600"><strong>Camareira</strong><br>camareira / 123</button>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button type="button" onclick="resetData()" class="text-xs text-slate-400 hover:text-red-500 transition-colors underline underline-offset-2">Resetar dados mockados</button>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        function fillAndSubmit(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errorElement = document.getElementById('errorMsg');
            
            const user = MockDB.login(u, p);
            
            if (user) {
                errorElement.classList.add('hidden');
                MockDB.routeUser(user);
            } else {
                errorElement.classList.remove('hidden');
            }
        });

        function resetData() {
            MockDB.reset();
            window.location.reload();
        }
        
        // Auto redirect if already logged in
        var existingUser = MockDB.getCurrentUser();
        if(existingUser) {
           MockDB.routeUser(existingUser);
        }
    </script>
</body>
</html>
