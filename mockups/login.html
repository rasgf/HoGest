<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <title>HotGest | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#f4f6f8',
                        100: '#e4ebf0',
                        200: '#c5d5df',
                        300: '#9cb5c5',
                        400: '#6c90a6',
                        500: '#4f768e',
                        600: '#3e5e74',
                        700: '#334b5e',
                        800: '#2d404f',
                        900: '#212E3C',
                        950: '#1a242d',
                    },
                    accent: {
                        50: '#fbfaf8',
                        100: '#f5f2ee',
                        200: '#ebe3db',
                        300: '#ddcec0',
                        400: '#cbb39e',
                        500: '#bca085',
                        600: '#af8c70',
                        700: '#92705a',
                        800: '#775e4e',
                        900: '#604c41',
                    },
                },
                boxShadow: {
                    'glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.2), inset 1px 0 0 0 rgba(255, 0, 0, 0.05), inset -1px 0 0 0 rgba(0, 0, 255, 0.05), 0 20px 40px 0 rgba(0, 0, 0, 0.1)',
                    'dark-glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05), inset 1px 0 0 0 rgba(255, 0, 0, 0.1), inset -1px 0 0 0 rgba(0, 200, 255, 0.1), 0 20px 40px 0 rgba(0, 0, 0, 0.5)',
                    'soft':  '0 2px 20px rgba(0, 0, 0, 0.03)',
                },
                animation: {
                    'blob': 'blob 14s infinite alternate',
                    'blob-reverse': 'blob-reverse 18s infinite alternate',
                },
                keyframes: {
                    blob: {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(80px, -100px) scale(1.2)' },
                        '66%': { transform: 'translate(-40px, 40px) scale(0.8)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    },
                    'blob-reverse': {
                        '0%': { transform: 'translate(0px, 0px) scale(1)' },
                        '33%': { transform: 'translate(-80px, 100px) scale(1.1)' },
                        '66%': { transform: 'translate(40px, -40px) scale(0.9)' },
                        '100%': { transform: 'translate(0px, 0px) scale(1)' },
                    }
                }
            }
        }
    };

    // Dark Mode Global Logic
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }
    
    // Initialize theme on load to prevent flash
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }

    // Dynamic Liquid Hover Effect
    document.addEventListener('DOMContentLoaded', () => {
        const attachLiquidGlow = () => {
            document.querySelectorAll('.liquid-card').forEach(card => {
                if(card.dataset.liquidInjected) return;
                card.dataset.liquidInjected = "true";
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });
        };
        attachLiquidGlow();
        
        // Re-attach periodically in case of dynamic DOM loads 
        setInterval(attachLiquidGlow, 1000);
    });
    </script>
    <style>
        .liquid-card {
            position: relative;
            overflow: hidden;
        }
        .liquid-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.12), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 0;
        }
        .dark .liquid-card::before {
            background: radial-gradient(600px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.06), transparent 40%);
        }
        .liquid-card:hover::before {
            opacity: 1;
        }
        /* Ensure content sits above the pseudo glow */
        .liquid-card > * {
            position: relative;
            z-index: 10;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/mock_database.js"></script>

    <!-- Apple Liquid Glass CSS Engine (Hardware Accelerated) -->
    <style>
    .apple-liquid-glass {
        position: relative;
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        /* Increased contrast for readability */
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.25) 100%); 
        border: 1px solid rgba(255,255,255,0.6);
        border-top: 1px solid rgba(255, 255, 255, 1);
        border-left: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: inset 0 1px 2px rgba(255,255,255,1), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,0,255,0.05), 0 24px 40px rgba(0,0,0,0.1);
        
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        will-change: transform, backdrop-filter;
    }
    html.dark .apple-liquid-glass {
        /* Increased dark mode contrast */
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.8) 0%, rgba(20, 20, 30, 0.45) 100%);
        border: 1px solid rgba(255,255,255,0.25);
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        border-left: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), inset 1px 0 rgba(255,0,0,0.05), inset -1px 0 rgba(0,200,255,0.05), 0 24px 40px rgba(0,0,0,0.6);
    }
    .apple-liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.4) 0%, transparent 60%);
        pointer-events: none;
        z-index: 10;
        opacity: 0.8;
    }
    html.dark .apple-liquid-glass::after {
        background: radial-gradient(120% 120% at 0% 0%, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
    }
    /* Enforce strong textual contrast globally on these cards */
    .apple-liquid-glass .text-slate-500 {
        color: #475569 !important;
    }
    html.dark .apple-liquid-glass .text-slate-500 {
        color: #cbd5e1 !important;
    }
    .apple-liquid-glass .text-slate-400 {
        color: #64748b !important;
    }
    html.dark .apple-liquid-glass .text-slate-400 {
        color: #e2e8f0 !important;
    }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl text-slate-800 dark:text-slate-200 font-sans min-h-screen flex items-center justify-center p-4">



    <!-- Animated Mesh Gradient Mesh (Enterprise) -->
    <div class="fixed top-[-20%] left-[-10%] w-[70vw] h-[70vh] rounded-full bg-primary-200/50 dark:bg-primary-900/40 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob"></div>
    <div class="fixed top-[20%] right-[-10%] w-[40vw] h-[50vh] rounded-full bg-accent-200/30 dark:bg-accent-900/40 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob-reverse" style="animation-delay: 2s;"></div>
    <div class="fixed bottom-[-20%] left-[20%] w-[50vw] h-[50vh] rounded-full bg-primary-300/30 dark:bg-primary-800/30 blur-[180px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0 animate-blob" style="animation-delay: 4s;"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[60%] rounded-full bg-gradient-to-tl from-rose-300/30 via-yellow-200/20 to-transparent dark:from-amber-900/40 dark:via-orange-900/20 blur-[120px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent-300/40 dark:bg-accent-800/20 blur-[100px] mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"></div>

    
    <div class="bg-white/70 dark:bg-slate-900/60 backdrop-blur-[32px] backdrop-saturate-[2.5] border-t border-l border-white/60 dark:border-slate-700/80 shadow-[0_8px_32px_rgb(0,0,0,0.08)] w-full max-w-md rounded-2xl shadow-xl border-t border-l border-white/60 dark:border-slate-700/80 overflow-hidden">
        <div class="p-8 pb-6 border-b border-gray-100 dark:border-slate-700 text-center">
            <img src="assets/insolito-logo.png" alt="Insolito" class="h-12 mx-auto mb-2">
            <p class="text-slate-500 dark:text-slate-400 text-sm">Sistema Integrado de Estancamento Operacional</p>
        </div>
        
        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Usuário de Acesso</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400 text-slate-400"></i>
                        </div>
                        <input type="text" id="username" class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-gray-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-3" placeholder="Ex: admin, controlador, executor_avac..." required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-slate-400 text-slate-400"></i>
                        </div>
                        <input type="password" id="password" class="bg-slate-50 dark:bg-slate-900 backdrop-blur-xl border border-gray-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-3" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="text-red-500 text-xs hidden font-medium text-center" id="errorMsg">
                    Usuário ou senha incorretos.
                </div>

                <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-3.5 text-center shadow-lg shadow-primary-500/30 transition-all active:scale-95">
                    Acessar Sistema
                </button>
            </form>

            <div class="mt-8 bg-slate-100 dark:bg-slate-900 p-4 rounded-lg border border-slate-200 dark:border-slate-700">
                <h4 class="text-xs font-bold text-slate-500 uppercase mb-3 text-center">Credenciais para Apresentação</h4>
                <p class="text-[10px] text-slate-400 text-center mb-3">Gestão</p>
                <div class="grid grid-cols-3 gap-2 text-xs mb-3">
                    <button type="button" onclick="fillAndSubmit('admin', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-primary-50 text-left border border-transparent hover:border-primary-200 dark:hover:border-slate-600"><strong>Admin Geral</strong><br>admin / 123</button>
                    <button type="button" onclick="fillAndSubmit('manutencao', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-primary-50 text-left border border-transparent hover:border-primary-200 dark:hover:border-slate-600"><strong>Manutenção</strong><br>manutencao / 123</button>
                    <button type="button" onclick="fillAndSubmit('controlador', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-orange-50 text-left border border-transparent hover:border-orange-200 dark:hover:border-slate-600"><strong>Controlador</strong><br>controlador / 123</button>
                </div>
                <p class="text-[10px] text-slate-400 text-center mb-3">Operação (Mobile)</p>
                <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                    <button type="button" onclick="fillAndSubmit('executor_eletrica', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-blue-50 text-left border border-transparent hover:border-blue-200 dark:hover:border-slate-600"><strong>Executor Elétrica</strong><br>executor_eletrica / 123</button>
                    <button type="button" onclick="fillAndSubmit('executor_hidraulica', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-blue-50 text-left border border-transparent hover:border-blue-200 dark:hover:border-slate-600"><strong>Executor Hidráulica</strong><br>executor_hidraulica / 123</button>
                </div>
                <p class="text-[10px] text-slate-400 text-center mb-3">Reportar Problemas</p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillAndSubmit('recepcao', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-emerald-50 text-left border border-transparent hover:border-emerald-200 dark:hover:border-slate-600"><strong>Recepção</strong><br>recepcao / 123</button>
                    <button type="button" onclick="fillAndSubmit('camareira', '123')" class="liquid-card apple-liquid-glass p-2 rounded hover:bg-purple-50 text-left border border-transparent hover:border-purple-200 dark:hover:border-slate-600"><strong>Camareira</strong><br>camareira / 123</button>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button type="button" onclick="resetData()" class="text-xs text-slate-400 hover:text-red-500 transition-colors underline underline-offset-2">Resetar dados mockados</button>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        function fillAndSubmit(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errorElement = document.getElementById('errorMsg');
            
            const user = MockDB.login(u, p);
            
            if (user) {
                errorElement.classList.add('hidden');
                MockDB.routeUser(user);
            } else {
                errorElement.classList.remove('hidden');
            }
        });

        function resetData() {
            MockDB.reset();
            window.location.reload();
        }
        
        // Auto redirect if already logged in
        var existingUser = MockDB.getCurrentUser();
        if(existingUser) {
           MockDB.routeUser(existingUser);
        }
    </script>
</body>
</html>
